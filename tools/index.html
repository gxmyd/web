<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 不缓存 -->
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="content-type" content="no-cache, must-revalidate" />
    <meta http-equiv="expires" content="Wed, 26 Feb 1997 08:21:57 GMT" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #4a90e2;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .topbar {
            max-width: 800px;
            margin: 20px auto;
            padding: 12px 20px;
            background: #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        .topbar button {
            padding: 8px 18px;
            font-size: 14px;
            margin: 0;
            border: none;
            border-radius: 5px;
            background-color: #4a90e2;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .topbar button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button onclick="window.location.href='../index.html'">返回首页</button>
    </div>
    <div class="container">
        <h1>工具页面</h1>
        <p>这里以后放各种小工具。</p>
    </div>
</body>
</html>
