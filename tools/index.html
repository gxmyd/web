<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="content-type" content="no-cache, must-revalidate" />
    <meta http-equiv="expires" content="Wed, 26 Feb 1997 08:21:57 GMT" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具集合 · 莫移达网站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-grad-1: #e0e7ff;
            --bg-grad-2: #fce7f3;
            --text: #1f2937;
            --text-soft: #6b7280;
            --card: #ffffff;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.12);
            --accent: #4a90e2;
            --accent-2: #357ABD;
        }
        [data-theme="dark"] {
            --bg: #0f1115;
            --bg-grad-1: #1a1d2b;
            --bg-grad-2: #2a1a2b;
            --text: #e5e7eb;
            --text-soft: #9ca3af;
            --card: #1c1f29;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.6);
            --accent: #5ea0f0;
            --accent-2: #4a8ad6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(at 20% 10%, var(--bg-grad-1) 0%, transparent 50%),
                              radial-gradient(at 80% 80%, var(--bg-grad-2) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 顶部行：左 返回 · 中 标题 · 右 主题切换 */
        .top-row {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .back-btn {
            grid-column: 1;
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
        }
        .back-btn:hover {
            transform: translateX(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
            color: var(--accent);
        }
        .page-title {
            grid-column: 2;
            margin: 0;
            font-size: 22px;
            color: var(--text);
        }
        .theme-toggle {
            grid-column: 3;
            justify-self: end;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text);
            transition: transform 0.15s;
        }
        .theme-toggle:hover { transform: scale(1.05); }

        /* 卡片网格 */
        .section {
            max-width: 960px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px 18px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .card .icon {
            font-size: 40px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-soft);
        }

        @media (max-width: 600px) {
            .top-row { grid-template-columns: auto 1fr auto; padding: 16px; }
            .page-title { font-size: 18px; }
            .back-btn, .theme-toggle { padding: 8px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="top-row">
        <a class="back-btn" href="../index.html">← 返回首页</a>
        <h1 class="page-title">🛠️ 工具集合</h1>
        <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
    </div>

    <div class="section">
        <div class="grid">
            <a class="card" href="image-compressor/index.html">
                <div class="icon">🗜️</div>
                <div class="card-title">图片压缩</div>
                <div class="card-desc">压缩图片，预估压缩后大小</div>
            </a>
            <a class="card" href="image-converter/index.html">
                <div class="icon">🔄</div>
                <div class="card-title">格式转换</div>
                <div class="card-desc">JPG / PNG / WEBP 互转</div>
            </a>
            <a class="card" href="qrcode/index.html">
                <div class="icon">📱</div>
                <div class="card-title">二维码</div>
                <div class="card-desc">生成二维码 / 解析二维码</div>
            </a>
        </div>
    </div>

    <script>
    // 主题：与首页共用 localStorage('theme')
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggle.textContent = '☀️ 亮色';
    }
    toggle.onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            toggle.textContent = '🌙 暗色';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggle.textContent = '☀️ 亮色';
        }
    };
    </script>
</body>
</html>
