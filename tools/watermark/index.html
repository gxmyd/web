<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片水印 - 加水印 / 去水印</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 0 16px 40px; }
        .topbar { max-width: 960px; margin: 20px auto 0; padding: 12px 20px; background: #ccc; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: left; }
        .topbar button { padding: 8px 18px; font-size: 14px; border: none; border-radius: 5px; background: #4a90e2; color: #fff; cursor: pointer; }
        .topbar button:hover { background: #357ABD; }
        .container { max-width: 960px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #4a90e2; margin: 0 0 16px; text-align: center; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 15px; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #4a90e2; border-bottom-color: #4a90e2; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: block; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
        .controls label { font-size: 14px; color: #555; }
        .controls input[type=range] { width: 140px; }
        .controls input[type=text] { padding: 6px 8px; font-size: 14px; min-width: 200px; }
        .btn { padding: 10px 22px; font-size: 14px; border: none; border-radius: 5px; background: #4a90e2; color: #fff; cursor: pointer; }
        .btn:hover { background: #357ABD; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .stage { display: flex; justify-content: center; margin-top: 16px; }
        .stage-inner { position: relative; display: inline-block; }
        .stage-inner canvas { max-width: 100%; border: 1px solid #ddd; }
        .stage-inner .sel { position: absolute; border: 2px dashed #4a90e2; background: rgba(74,144,226,0.15); pointer-events: none; display: none; }
        .info { font-size: 13px; color: #888; margin: 6px 0; text-align: center; }
        .pos-grid { display: grid; grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(3, 30px); gap: 2px; }
        .pos-cell { background: #eee; border-radius: 3px; cursor: pointer; }
        .pos-cell.active { background: #4a90e2; }
    </style>
</head>
<body>
    <div class="topbar"><button onclick="window.location.href='../index.html'">返回工具页</button></div>
    <div class="container">
        <h1>图片水印</h1>
        <div class="tabs">
            <button class="tab active" data-tab="add">加水印</button>
            <button class="tab" data-tab="remove">去水印</button>
        </div>

        <div class="panel active" id="panel-add">
            <div class="controls">
                <input type="file" id="addFile" accept="image/*">
                <label>水印类型：</label>
                <select id="addType">
                    <option value="text">文字</option>
                    <option value="image">图片</option>
                </select>
                <input type="text" id="addText" placeholder="水印文字" value="我的水印">
                <input type="file" id="addImgFile" accept="image/*" style="display:none;">
                <label>大小：<input type="range" id="addSize" min="10" max="200" value="40"></label>
                <label>透明度：<input type="range" id="addAlpha" min="0" max="100" value="50"></label>
                <label>颜色：<input type="color" id="addColor" value="#ffffff"></label>
                <label>位置：</label>
                <div class="pos-grid" id="addPos">
                    <div class="pos-cell" data-i="0"></div><div class="pos-cell" data-i="1"></div><div class="pos-cell" data-i="2"></div>
                    <div class="pos-cell" data-i="3"></div><div class="pos-cell" data-i="4"></div><div class="pos-cell" data-i="5"></div>
                    <div class="pos-cell" data-i="6"></div><div class="pos-cell" data-i="7"></div><div class="pos-cell active" data-i="8"></div>
                </div>
                <button class="btn" id="btnApplyAdd" disabled>应用并下载</button>
            </div>
            <div class="info" id="addInfo">请选择图片</div>
            <div class="stage"><div class="stage-inner"><canvas id="addCanvas"></canvas></div></div>
        </div>

        <div class="panel" id="panel-remove">
            <div class="controls">
                <input type="file" id="rmFile" accept="image/*">
                <label>修复方式：</label>
                <select id="rmMode">
                    <option value="blur">边缘模糊覆盖</option>
                    <option value="solid">纯色覆盖（手动选色）</option>
                </select>
                <input type="color" id="rmColor" value="#ffffff" style="display:none;">
                <button class="btn" id="btnApplyRm" disabled>应用并下载</button>
                <span class="info" id="rmInfo">在图上拖框选要去水印的区域</span>
            </div>
            <div class="stage"><div class="stage-inner" id="rmStage"><canvas id="rmCanvas"></canvas><div class="sel" id="rmSel"></div></div></div>
        </div>
    </div>

    <script>
    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('panel-' + t.dataset.tab).classList.add('active');
        };
    });

    function fileToImage(f) {
        return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    }
    function fitSize(img, max = 720) { return Math.min(1, max / Math.max(img.width, img.height)); }
    function downloadCanvas(canvas, name) {
        canvas.toBlob(b => { const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); });
    }

    // ===== 加水印 =====
    let addImg = null, addScale = 1, addPosI = 8, addWatermarkImg = null;
    const addCanvas = document.getElementById('addCanvas');
    const addCtx = addCanvas.getContext('2d');

    document.getElementById('addFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        addImg = await fileToImage(f);
        addScale = fitSize(addImg);
        addCanvas.width = Math.round(addImg.width * addScale);
        addCanvas.height = Math.round(addImg.height * addScale);
        drawAdd();
        document.getElementById('btnApplyAdd').disabled = false;
        document.getElementById('addInfo').textContent = `原图：${addImg.width}×${addImg.height}`;
    };
    document.getElementById('addType').onchange = (e) => {
        const isText = e.target.value === 'text';
        document.getElementById('addText').style.display = isText ? '' : 'none';
        document.getElementById('addImgFile').style.display = isText ? 'none' : '';
        drawAdd();
    };
    document.getElementById('addImgFile').onchange = async (e) => {
        const f = e.target.files[0];
        if (f) { addWatermarkImg = await fileToImage(f); drawAdd(); }
    };
    ['addText', 'addSize', 'addAlpha', 'addColor'].forEach(id => {
        document.getElementById(id).oninput = drawAdd;
    });
    document.querySelectorAll('#addPos .pos-cell').forEach(c => {
        c.onclick = () => {
            document.querySelectorAll('#addPos .pos-cell').forEach(x => x.classList.remove('active'));
            c.classList.add('active');
            addPosI = +c.dataset.i;
            drawAdd();
        };
    });

    function drawAdd() {
        if (!addImg) return;
        addCtx.clearRect(0, 0, addCanvas.width, addCanvas.height);
        addCtx.drawImage(addImg, 0, 0, addCanvas.width, addCanvas.height);
        const type = document.getElementById('addType').value;
        const alpha = +document.getElementById('addAlpha').value / 100;
        const size = +document.getElementById('addSize').value * addScale;
        let wmCanvas = document.createElement('canvas');
        if (type === 'text') {
            const text = document.getElementById('addText').value || '水印';
            addCtx.font = `bold ${size}px sans-serif`;
            const metrics = addCtx.measureText(text);
            wmCanvas.width = Math.ceil(metrics.width) + 10;
            wmCanvas.height = Math.ceil(size * 1.2);
            const c = wmCanvas.getContext('2d');
            c.font = `bold ${size}px sans-serif`;
            c.fillStyle = document.getElementById('addColor').value;
            c.globalAlpha = alpha;
            c.fillText(text, 0, size);
        } else if (addWatermarkImg) {
            const ratio = Math.min(1, size * 4 / Math.max(addWatermarkImg.width, addWatermarkImg.height));
            wmCanvas.width = Math.round(addWatermarkImg.width * ratio);
            wmCanvas.height = Math.round(addWatermarkImg.height * ratio);
            const c = wmCanvas.getContext('2d');
            c.globalAlpha = alpha;
            c.drawImage(addWatermarkImg, 0, 0, wmCanvas.width, wmCanvas.height);
        } else return;
        const col = addPosI % 3, row = Math.floor(addPosI / 3);
        const margin = 20;
        const x = col === 0 ? margin : col === 1 ? (addCanvas.width - wmCanvas.width) / 2 : addCanvas.width - wmCanvas.width - margin;
        const y = row === 0 ? margin : row === 1 ? (addCanvas.height - wmCanvas.height) / 2 : addCanvas.height - wmCanvas.height - margin;
        addCtx.drawImage(wmCanvas, x, y);
    }
    document.getElementById('btnApplyAdd').onclick = () => {
        // 用全分辨率画一张
        const c = document.createElement('canvas');
        c.width = addImg.width; c.height = addImg.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(addImg, 0, 0);
        const type = document.getElementById('addType').value;
        const alpha = +document.getElementById('addAlpha').value / 100;
        const size = +document.getElementById('addSize').value;
        let wmCanvas = document.createElement('canvas');
        if (type === 'text') {
            const text = document.getElementById('addText').value || '水印';
            ctx.font = `bold ${size}px sans-serif`;
            const m = ctx.measureText(text);
            wmCanvas.width = Math.ceil(m.width) + 10;
            wmCanvas.height = Math.ceil(size * 1.2);
            const cc = wmCanvas.getContext('2d');
            cc.font = `bold ${size}px sans-serif`;
            cc.fillStyle = document.getElementById('addColor').value;
            cc.globalAlpha = alpha;
            cc.fillText(text, 0, size);
        } else if (addWatermarkImg) {
            const ratio = Math.min(1, size * 4 / Math.max(addWatermarkImg.width, addWatermarkImg.height));
            wmCanvas.width = Math.round(addWatermarkImg.width * ratio);
            wmCanvas.height = Math.round(addWatermarkImg.height * ratio);
            const cc = wmCanvas.getContext('2d');
            cc.globalAlpha = alpha;
            cc.drawImage(addWatermarkImg, 0, 0, wmCanvas.width, wmCanvas.height);
        } else { alert('请先选择水印图片'); return; }
        const col = addPosI % 3, row = Math.floor(addPosI / 3);
        const margin = Math.round(20 / addScale);
        const x = col === 0 ? margin : col === 1 ? (c.width - wmCanvas.width) / 2 : c.width - wmCanvas.width - margin;
        const y = row === 0 ? margin : row === 1 ? (c.height - wmCanvas.height) / 2 : c.height - wmCanvas.height - margin;
        ctx.drawImage(wmCanvas, x, y);
        downloadCanvas(c, `watermarked_${Date.now()}.png`);
    };

    // ===== 去水印 =====
    let rmImg = null, rmScale = 1, rmRect = null, rmDrag = null;
    const rmCanvas = document.getElementById('rmCanvas');
    const rmCtx = rmCanvas.getContext('2d');
    const rmSel = document.getElementById('rmSel');
    const rmStage = document.getElementById('rmStage');

    document.getElementById('rmFile').onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        rmImg = await fileToImage(f);
        rmScale = fitSize(rmImg);
        rmCanvas.width = Math.round(rmImg.width * rmScale);
        rmCanvas.height = Math.round(rmImg.height * rmScale);
        rmCtx.drawImage(rmImg, 0, 0, rmCanvas.width, rmCanvas.height);
        rmSel.style.display = 'none';
        rmRect = null;
        document.getElementById('btnApplyRm').disabled = true;
    };
    document.getElementById('rmMode').onchange = (e) => {
        document.getElementById('rmColor').style.display = e.target.value === 'solid' ? '' : 'none';
    };

    function getMousePos(e) {
        const r = rmCanvas.getBoundingClientRect();
        return {
            x: (e.clientX - r.left) * (rmCanvas.width / r.width),
            y: (e.clientY - r.top) * (rmCanvas.height / r.height)
        };
    }
    rmCanvas.onmousedown = (e) => { rmDrag = getMousePos(e); };
    rmCanvas.onmousemove = (e) => {
        if (!rmDrag) return;
        const p = getMousePos(e);
        const r = rmCanvas.getBoundingClientRect();
        const x0 = Math.min(rmDrag.x, p.x), y0 = Math.min(rmDrag.y, p.y);
        const w = Math.abs(p.x - rmDrag.x), h = Math.abs(p.y - rmDrag.y);
        rmSel.style.display = 'block';
        rmSel.style.left = (x0 * r.width / rmCanvas.width) + 'px';
        rmSel.style.top = (y0 * r.height / rmCanvas.height) + 'px';
        rmSel.style.width = (w * r.width / rmCanvas.width) + 'px';
        rmSel.style.height = (h * r.height / rmCanvas.height) + 'px';
        rmRect = { x: x0, y: y0, w, h };
    };
    rmCanvas.onmouseup = rmCanvas.onmouseleave = () => {
        rmDrag = null;
        if (rmRect && rmRect.w > 4 && rmRect.h > 4) document.getElementById('btnApplyRm').disabled = false;
    };

    document.getElementById('btnApplyRm').onclick = () => {
        if (!rmImg || !rmRect) return;
        // 在全分辨率上做
        const c = document.createElement('canvas');
        c.width = rmImg.width; c.height = rmImg.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(rmImg, 0, 0);
        const rx = Math.round(rmRect.x / rmScale);
        const ry = Math.round(rmRect.y / rmScale);
        const rw = Math.round(rmRect.w / rmScale);
        const rh = Math.round(rmRect.h / rmScale);
        const mode = document.getElementById('rmMode').value;
        if (mode === 'solid') {
            ctx.fillStyle = document.getElementById('rmColor').value;
            ctx.fillRect(rx, ry, rw, rh);
        } else {
            // 边缘模糊：取选区边缘 1-6 像素的均值，作为整块填充
            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const data = imgData.data;
            const W = c.width;
            const sample = (x, y) => {
                const i = (y * W + x) * 4;
                return [data[i], data[i+1], data[i+2], data[i+3]];
            };
            let r=0,g=0,b=0,n=0;
            for (let t = 0; t < 6; t++) {
                for (let dx = 0; dx < rw; dx++) {
                    const px1 = rx + dx, py1 = ry - 1 - t; if (py1 < 0) continue;
                    const px2 = rx + dx, py2 = ry + rh + t; if (py2 >= c.height) continue;
                    const s1 = sample(px1, py1), s2 = sample(px2, py2);
                    r += s1[0] + s2[0]; g += s1[1] + s2[1]; b += s1[2] + s2[2]; n += 2;
                }
                for (let dy = 0; dy < rh; dy++) {
                    const px1 = rx - 1 - t, py1 = ry + dy; if (px1 < 0) continue;
                    const px2 = rx + rw + t, py2 = ry + dy; if (px2 >= c.width) continue;
                    const s1 = sample(px1, py1), s2 = sample(px2, py2);
                    r += s1[0] + s2[0]; g += s1[1] + s2[1]; b += s1[2] + s2[2]; n += 2;
                }
            }
            r = n ? Math.round(r/n) : 255;
            g = n ? Math.round(g/n) : 255;
            b = n ? Math.round(b/n) : 255;
            const id = ctx.createImageData(rw, rh);
            for (let i = 0; i < rw*rh; i++) {
                id.data[i*4] = r; id.data[i*4+1] = g; id.data[i*4+2] = b; id.data[i*4+3] = 255;
            }
            ctx.putImageData(id, rx, ry);
        }
        downloadCanvas(c, `removed_${Date.now()}.png`);
    };
    </script>
</body>
</html>
