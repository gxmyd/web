<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <title>单位换算</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 0 16px 40px; }
        .topbar { max-width: 960px; margin: 20px auto 0; padding: 4px 20px;     }
        .topbar button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 24px;
            background: #fff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, color 0.15s;
        }
        .topbar button:hover {
            transform: translateX(-2px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.12);
            border-color: #4a90e2;
            color: #4a90e2;
        }
        .container { max-width: 960px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #4a90e2; margin: 0 0 16px; text-align: center; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 15px; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #4a90e2; border-bottom-color: #4a90e2; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: block; }
        .conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
        .conv .group { display: flex; flex-direction: column; }
        .conv label { font-size: 13px; color: #888; margin-bottom: 4px; }
        .conv input { padding: 10px 12px; font-size: 18px; border: 1px solid #ddd; border-radius: 6px; width: 100%; }
        .conv select { padding: 10px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; margin-top: 4px; }
        .arrow { font-size: 24px; color: #4a90e2; padding-bottom: 12px; text-align: center; }
        .batch { margin-top: 18px; }
        .batch-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .batch-row span:first-child { color: #888; }
        .batch-row span:last-child { font-weight: bold; color: #4a90e2; font-family: monospace; }
        .info { font-size: 13px; color: #888; margin: 6px 0; }
    </style>
</head>
<body>
    <div class="topbar"><button onclick="window.location.href='../../index.html'">← 返回工具页</button></div>
    <div class="container">
        <h1>单位换算</h1>
        <div class="tabs">
            <button class="tab active" data-tab="length">长度</button>
            <button class="tab" data-tab="weight">重量</button>
            <button class="tab" data-tab="temp">温度</button>
            <button class="tab" data-tab="base">进制</button>
        </div>

        <div class="panel active" id="panel-length">
            <div class="conv">
                <div class="group">
                    <label>数值</label>
                    <input type="number" id="len-val" value="1">
                    <select id="len-from"></select>
                </div>
                <div class="arrow">⇄</div>
                <div class="group">
                    <label>结果</label>
                    <input type="number" id="len-out" readonly>
                    <select id="len-to"></select>
                </div>
            </div>
            <div class="batch" id="len-batch"></div>
        </div>

        <div class="panel" id="panel-weight">
            <div class="conv">
                <div class="group">
                    <label>数值</label>
                    <input type="number" id="wt-val" value="1">
                    <select id="wt-from"></select>
                </div>
                <div class="arrow">⇄</div>
                <div class="group">
                    <label>结果</label>
                    <input type="number" id="wt-out" readonly>
                    <select id="wt-to"></select>
                </div>
            </div>
            <div class="batch" id="wt-batch"></div>
        </div>

        <div class="panel" id="panel-temp">
            <div class="conv">
                <div class="group">
                    <label>数值</label>
                    <input type="number" id="tmp-val" value="0">
                    <select id="tmp-from">
                        <option value="C">摄氏度 (°C)</option>
                        <option value="F">华氏度 (°F)</option>
                        <option value="K">开尔文 (K)</option>
                    </select>
                </div>
                <div class="arrow">⇄</div>
                <div class="group">
                    <label>结果</label>
                    <input type="number" id="tmp-out" readonly>
                    <select id="tmp-to">
                        <option value="C">摄氏度 (°C)</option>
                        <option value="F" selected>华氏度 (°F)</option>
                        <option value="K">开尔文 (K)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="panel" id="panel-base">
            <div class="conv">
                <div class="group">
                    <label>输入（支持小数）</label>
                    <input type="text" id="bs-val" value="255">
                    <select id="bs-from">
                        <option value="2">二进制 (2)</option>
                        <option value="8">八进制 (8)</option>
                        <option value="10" selected>十进制 (10)</option>
                        <option value="16">十六进制 (16)</option>
                    </select>
                </div>
                <div class="arrow">⇄</div>
                <div class="group">
                    <label>结果</label>
                    <input type="text" id="bs-out" readonly>
                    <select id="bs-to">
                        <option value="2" selected>二进制 (2)</option>
                        <option value="8">八进制 (8)</option>
                        <option value="10">十进制 (10)</option>
                        <option value="16">十六进制 (16)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('panel-' + t.dataset.tab).classList.add('active');
        };
    });

    // ===== 长度（基准：米）=====
    const LEN_UNITS = {
        '毫米 (mm)': 0.001,
        '厘米 (cm)': 0.01,
        '分米 (dm)': 0.1,
        '米 (m)': 1,
        '千米 (km)': 1000,
        '英寸 (inch)': 0.0254,
        '英尺 (ft)': 0.3048,
        '码 (yard)': 0.9144,
        '英里 (mile)': 1609.344,
    };
    // ===== 重量（基准：克）=====
    const WT_UNITS = {
        '毫克 (mg)': 0.001,
        '克 (g)': 1,
        '千克 (kg)': 1000,
        '吨 (t)': 1000000,
        '盎司 (oz)': 28.3495,
        '磅 (lb)': 453.592,
    };

    function fillSelect(sel, units) {
        Object.keys(units).forEach((name, i) => {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            if (name.startsWith('米 (') || name.startsWith('克 (')) opt.selected = true;
            sel.appendChild(opt);
        });
    }
    function bindConv(valId, fromId, toId, outId, batchId, units) {
        const val = document.getElementById(valId);
        const from = document.getElementById(fromId);
        const to = document.getElementById(toId);
        const out = document.getElementById(outId);
        const batch = document.getElementById(batchId);
        fillSelect(from, units); fillSelect(to, units);
        function calc() {
            const v = parseFloat(val.value);
            if (isNaN(v)) { out.value = ''; return; }
            const inMeter = v * units[from.value];
            const result = inMeter / units[to.value];
            out.value = +result.toPrecision(10);
            if (batch) {
                batch.innerHTML = '';
                Object.keys(units).forEach(name => {
                    if (name === from.value) return;
                    const r = (v * units[from.value] / units[name]);
                    const row = document.createElement('div');
                    row.className = 'batch-row';
                    row.innerHTML = `<span>${name}</span><span>${+r.toPrecision(10)}</span>`;
                    batch.appendChild(row);
                });
            }
        }
        [val, from, to].forEach(el => el.addEventListener('input', calc));
        calc();
    }
    bindConv('len-val', 'len-from', 'len-to', 'len-out', 'len-batch', LEN_UNITS);
    bindConv('wt-val', 'wt-from', 'wt-to', 'wt-out', 'wt-batch', WT_UNITS);

    // ===== 温度 =====
    const tmpVal = document.getElementById('tmp-val');
    const tmpFrom = document.getElementById('tmp-from');
    const tmpTo = document.getElementById('tmp-to');
    const tmpOut = document.getElementById('tmp-out');
    function toC(v, f) {
        if (f === 'C') return v;
        if (f === 'F') return (v - 32) * 5 / 9;
        if (f === 'K') return v - 273.15;
    }
    function fromC(c, t) {
        if (t === 'C') return c;
        if (t === 'F') return c * 9 / 5 + 32;
        if (t === 'K') return c + 273.15;
    }
    function calcTemp() {
        const v = parseFloat(tmpVal.value);
        if (isNaN(v)) { tmpOut.value = ''; return; }
        tmpOut.value = +fromC(toC(v, tmpFrom.value), tmpTo.value).toFixed(4);
    }
    [tmpVal, tmpFrom, tmpTo].forEach(el => el.addEventListener('input', calcTemp));
    calcTemp();

    // ===== 进制 =====
    const bsVal = document.getElementById('bs-val');
    const bsFrom = document.getElementById('bs-from');
    const bsTo = document.getElementById('bs-to');
    const bsOut = document.getElementById('bs-out');
    function calcBase() {
        const raw = bsVal.value.trim();
        if (!raw) { bsOut.value = ''; return; }
        const from = +bsFrom.value, to = +bsTo.value;
        try {
            // 处理小数：把小数部分按目标进制展开
            const [intPart, fracPart] = raw.split('.');
            const intDec = parseInt(intPart || '0', from);
            if (isNaN(intDec)) throw '整数部分不合法';
            let result = intDec.toString(to).toUpperCase();
            if (fracPart) {
                if (to !== 10) {
                    // 先转十进制小数
                    let dec = intDec;
                    for (let i = 0; i < fracPart.length; i++) {
                        const d = parseInt(fracPart[i], from);
                        if (isNaN(d)) throw '小数部分不合法';
                        dec += d * Math.pow(from, -(i + 1));
                    }
                    // 再转目标进制
                    let fracStr = '';
                    let v = dec - Math.floor(dec);
                    for (let i = 0; i < 12; i++) {
                        v *= to;
                        const d = Math.floor(v);
                        fracStr += d.toString(to).toUpperCase();
                        v -= d;
                        if (v < 1e-12) break;
                    }
                    result = result + '.' + fracStr;
                } else {
                    let fracVal = 0;
                    for (let i = 0; i < fracPart.length; i++) {
                        const d = parseInt(fracPart[i], from);
                        if (isNaN(d)) throw '小数部分不合法';
                        fracVal += d * Math.pow(from, -(i + 1));
                    }
                    result = result + '.' + (intDec + fracVal).toString().split('.')[1] || '';
                    // 简单：直接拼
                    const total = intDec + fracVal;
                    result = total.toString();
                }
            }
            bsOut.value = result;
        } catch (e) {
            bsOut.value = '错误: ' + e;
        }
    }
    [bsVal, bsFrom, bsTo].forEach(el => el.addEventListener('input', calcBase));
    calcBase();
    </script>
</body>
</html>
