<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <title>图片压缩</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 0 16px 40px; }
        .topbar { max-width: 960px; margin: 20px auto 0; padding: 4px 20px;     }
        .topbar button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 24px;
            background: #fff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, color 0.15s;
        }
        .topbar button:hover {
            transform: translateX(-2px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.12);
            border-color: #4a90e2;
            color: #4a90e2;
        }
        .container { max-width: 960px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #4a90e2; margin: 0 0 16px; text-align: center; }
        .controls { margin: 16px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
        .controls label { font-size: 14px; color: #555; }
        .controls input[type=file] { font-size: 14px; }
        .controls input[type=range] { width: 220px; vertical-align: middle; }
        .btn { padding: 12px 28px; font-size: 15px; border: none; border-radius: 5px; background: #4a90e2; color: #fff; cursor: pointer; }
        .btn:hover { background: #357ABD; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .preview { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; margin-top: 20px; }
        .preview-block { text-align: center; }
        .preview-block h3 { margin: 0 0 6px; font-size: 14px; color: #555; }
        .preview-block canvas { max-width: 360px; max-height: 360px; border: 1px solid #ddd; background: #fafafa; }
        .preview-block .size { margin-top: 6px; font-size: 14px; color: #333; font-family: 'Courier New', monospace; }
        .preview-block .size .delta { font-weight: bold; }
        .preview-block .size .delta.down { color: #4caf50; }
        .preview-block .size .delta.up { color: #f44336; }
        .info { font-size: 13px; color: #888; margin: 6px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="topbar"><button onclick="window.location.href='../index.html'">← 返回首页</button></div>
    <div class="container">
        <h1>图片压缩</h1>
        <div class="controls">
            <input type="file" id="file" accept="image/*">
            <label>质量：<input type="range" id="q" min="0.1" max="1" step="0.05" value="0.8"> <span id="qVal">0.80</span></label>
            <button class="btn" id="btn" disabled>压缩并下载</button>
        </div>
        <div class="info" id="info">请选择图片（支持 JPG / PNG / WEBP）</div>
        <div class="preview">
            <div class="preview-block">
                <h3>原图</h3>
                <canvas id="orig"></canvas>
                <div class="size" id="origSize">--</div>
            </div>
            <div class="preview-block">
                <h3>压缩后</h3>
                <canvas id="out"></canvas>
                <div class="size" id="outSize">--</div>
            </div>
        </div>
    </div>
    <script>
    const orig = document.getElementById('orig');
    const out = document.getElementById('out');
    const fileInput = document.getElementById('file');
    const qInput = document.getElementById('q');
    const qVal = document.getElementById('qVal');
    const btn = document.getElementById('btn');
    const info = document.getElementById('info');
    const origSize = document.getElementById('origSize');
    const outSize = document.getElementById('outSize');

    let img = null, origFileSize = 0, origW = 0, origH = 0;
    const MAX_DISPLAY = 360;

    qInput.oninput = () => { qVal.textContent = (+qInput.value).toFixed(2); if (img) compress(); };

    fileInput.onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        origFileSize = f.size;
        const i = new Image();
        i.onload = () => {
            img = i; origW = i.width; origH = i.height;
            const ratio = Math.min(1, MAX_DISPLAY / Math.max(i.width, i.height));
            orig.width = Math.round(i.width * ratio);
            orig.height = Math.round(i.height * ratio);
            orig.getContext('2d').drawImage(i, 0, 0, orig.width, orig.height);
            out.width = orig.width; out.height = orig.height;
            out.getContext('2d').drawImage(i, 0, 0, out.width, out.height);
            origSize.innerHTML = `${i.width}×${i.height} · <strong>${formatKB(origFileSize)}</strong>`;
            info.textContent = `${f.name || '未命名'} · ${i.width}×${i.height} · ${f.type || '未知格式'}`;
            compress();
            btn.disabled = false;
        };
        i.src = URL.createObjectURL(f);
    };

    function formatKB(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    function compress() {
        if (!img) return;
        const q = +qInput.value;
        // PNG 不支持 quality 参数；自动切到 image/jpeg 走质量模式
        const mime = 'image/jpeg';
        out.getContext('2d').drawImage(img, 0, 0, out.width, out.height);
        out.toBlob((blob) => {
            if (!blob) { outSize.textContent = '压缩失败'; return; }
            const newKB = formatKB(blob.size);
            const delta = ((blob.size - origFileSize) / origFileSize * 100);
            const cls = delta < 0 ? 'down' : 'up';
            const sign = delta < 0 ? '' : '+';
            outSize.innerHTML = `${origW}×${origH} · <strong>${newKB}</strong> <span class="delta ${cls}">(${sign}${delta.toFixed(0)}%)</span>`;
            out._lastBlob = blob;
        }, mime, q);
    }

    btn.onclick = () => {
        if (!out._lastBlob) return;
        const url = URL.createObjectURL(out._lastBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `compressed_${Date.now()}.jpg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    </script>
</body>
</html>
