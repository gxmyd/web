<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片处理 - 压缩/裁剪/九宫格</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; margin: 0; padding: 0 16px 40px; }
        .topbar { max-width: 960px; margin: 20px auto 0; padding: 12px 20px; background: #ccc; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: left; }
        .topbar button { padding: 8px 18px; font-size: 14px; border: none; border-radius: 5px; background: #4a90e2; color: #fff; cursor: pointer; }
        .topbar button:hover { background: #357ABD; }
        .container { max-width: 960px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #4a90e2; margin: 0 0 16px; text-align: center; }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 15px; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #4a90e2; border-bottom-color: #4a90e2; font-weight: bold; }
        .panel { display: none; }
        .panel.active { display: block; }
        .controls { margin: 16px 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .controls label { font-size: 14px; color: #555; }
        .controls input[type=file] { font-size: 14px; }
        .controls input[type=range] { width: 200px; }
        .btn { padding: 10px 22px; font-size: 14px; border: none; border-radius: 5px; background: #4a90e2; color: #fff; cursor: pointer; }
        .btn:hover { background: #357ABD; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .preview { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; margin-top: 16px; }
        .preview-block { text-align: center; }
        .preview-block h3 { margin: 0 0 6px; font-size: 14px; color: #555; }
        .preview-block canvas, .preview-block img { max-width: 360px; max-height: 360px; border: 1px solid #ddd; background: #fafafa; }
        .info { font-size: 13px; color: #888; margin: 6px 0; }
        .crop-stage { position: relative; display: inline-block; max-width: 100%; }
        .crop-stage canvas { max-width: 100%; cursor: crosshair; }
        .crop-stage .sel { position: absolute; border: 2px dashed #4a90e2; background: rgba(74,144,226,0.15); pointer-events: none; }
        .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 540px; margin: 0 auto; }
        .grid9 canvas { width: 100%; height: auto; border: 1px solid #ddd; display: block; }
    </style>
</head>
<body>
    <div class="topbar"><button onclick="window.location.href='../index.html'">返回工具页</button></div>
    <div class="container">
        <h1>图片处理</h1>
        <div class="tabs">
            <button class="tab active" data-tab="compress">压缩</button>
            <button class="tab" data-tab="crop">裁剪</button>
            <button class="tab" data-tab="grid9">九宫格</button>
        </div>

        <!-- 压缩 -->
        <div class="panel active" id="panel-compress">
            <div class="controls">
                <input type="file" id="fileCompress" accept="image/*">
                <label>质量：<input type="range" id="qCompress" min="0.1" max="1" step="0.05" value="0.8"> <span id="qCompressVal">0.80</span></label>
                <button class="btn" id="btnCompress" disabled>压缩并下载</button>
            </div>
            <div class="info" id="infoCompress">请选择图片</div>
            <div class="preview">
                <div class="preview-block"><h3>原图</h3><canvas id="canvasCompressOrig"></canvas></div>
                <div class="preview-block"><h3>压缩后</h3><canvas id="canvasCompressOut"></canvas></div>
            </div>
        </div>

        <!-- 裁剪 -->
        <div class="panel" id="panel-crop">
            <div class="controls">
                <input type="file" id="fileCrop" accept="image/*">
                <button class="btn" id="btnCrop" disabled>裁剪并下载</button>
                <span class="info" id="infoCrop"></span>
            </div>
            <div class="preview" style="justify-content:center;">
                <div class="crop-stage" id="cropStage">
                    <canvas id="canvasCrop"></canvas>
                    <div class="sel" id="cropSel" style="display:none;"></div>
                </div>
            </div>
            <p class="info" style="text-align:center;">在图片上按住鼠标拖拽选择裁剪区域</p>
        </div>

        <!-- 九宫格 -->
        <div class="panel" id="panel-grid9">
            <div class="controls">
                <input type="file" id="fileGrid9" accept="image/*">
                <button class="btn" id="btnGrid9" disabled>下载全部（9张）</button>
                <span class="info" id="infoGrid9"></span>
            </div>
            <div class="grid9" id="grid9Result"></div>
        </div>
    </div>

    <script>
    // 通用：Tab 切换
    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('panel-' + t.dataset.tab).classList.add('active');
        };
    });

    // 工具：把 file 转 Image 对象
    function fileToImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    // 工具：Canvas 自适应显示（最大边 360）
    function drawToCanvas(canvas, img, maxSide = 360) {
        const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    // 工具：下载 dataURL
    function downloadDataURL(dataURL, filename) {
        const a = document.createElement('a');
        a.href = dataURL;
        a.download = filename;
        a.click();
    }

    // ===== 压缩 =====
    let compressOrigImg = null;
    const fileCompress = document.getElementById('fileCompress');
    const qCompress = document.getElementById('qCompress');
    const qCompressVal = document.getElementById('qCompressVal');
    const btnCompress = document.getElementById('btnCompress');
    qCompress.oninput = () => { qCompressVal.textContent = (+qCompress.value).toFixed(2); };

    fileCompress.onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        compressOrigImg = await fileToImage(f);
        drawToCanvas(document.getElementById('canvasCompressOrig'), compressOrigImg);
        const out = document.getElementById('canvasCompressOut');
        out.width = document.getElementById('canvasCompressOrig').width;
        out.height = document.getElementById('canvasCompressOrig').height;
        out.getContext('2d').drawImage(compressOrigImg, 0, 0, out.width, out.height);
        btnCompress.disabled = false;
        document.getElementById('infoCompress').textContent = `原图：${compressOrigImg.width}×${compressOrigImg.height} · ${(f.size/1024).toFixed(1)} KB`;
    };

    btnCompress.onclick = () => {
        const c = document.getElementById('canvasCompressOut');
        const dataURL = c.toDataURL('image/jpeg', +qCompress.value);
        const sizeKB = (dataURL.length * 3 / 4 / 1024).toFixed(1);
        document.getElementById('infoCompress').textContent = `原图 + 压缩后：${(compressOrigImg.width)}×${compressOrigImg.height} · 压缩后约 ${sizeKB} KB`;
        downloadDataURL(dataURL, `compressed_${Date.now()}.jpg`);
    };

    // ===== 裁剪 =====
    let cropImg = null, cropScale = 1;
    const cropCanvas = document.getElementById('canvasCrop');
    const cropSel = document.getElementById('cropSel');
    const cropStage = document.getElementById('cropStage');
    const btnCrop = document.getElementById('btnCrop');
    let dragStart = null, cropRect = null;

    document.getElementById('fileCrop').onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        cropImg = await fileToImage(f);
        cropScale = Math.min(1, 600 / Math.max(cropImg.width, cropImg.height));
        cropCanvas.width = Math.round(cropImg.width * cropScale);
        cropCanvas.height = Math.round(cropImg.height * cropScale);
        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(cropImg, 0, 0, cropCanvas.width, cropCanvas.height);
        cropSel.style.display = 'none';
        cropRect = null;
        btnCrop.disabled = true;
        document.getElementById('infoCrop').textContent = `原图：${cropImg.width}×${cropImg.height}`;
    };

    cropCanvas.onmousedown = (e) => {
        const r = cropCanvas.getBoundingClientRect();
        const x = (e.clientX - r.left) * (cropCanvas.width / r.width);
        const y = (e.clientY - r.top) * (cropCanvas.height / r.height);
        dragStart = { x, y };
    };
    cropCanvas.onmousemove = (e) => {
        if (!dragStart) return;
        const r = cropCanvas.getBoundingClientRect();
        const x = (e.clientX - r.left) * (cropCanvas.width / r.width);
        const y = (e.clientY - r.top) * (cropCanvas.height / r.height);
        const x0 = Math.min(dragStart.x, x), y0 = Math.min(dragStart.y, y);
        const w = Math.abs(x - dragStart.x), h = Math.abs(y - dragStart.y);
        const rect = cropCanvas.getBoundingClientRect();
        cropSel.style.display = 'block';
        cropSel.style.left = (x0 * rect.width / cropCanvas.width) + 'px';
        cropSel.style.top = (y0 * rect.height / cropCanvas.height) + 'px';
        cropSel.style.width = (w * rect.width / cropCanvas.width) + 'px';
        cropSel.style.height = (h * rect.height / cropCanvas.height) + 'px';
        cropRect = { x: x0, y: y0, w, h };
    };
    cropCanvas.onmouseup = cropCanvas.onmouseleave = () => {
        dragStart = null;
        if (cropRect && cropRect.w > 4 && cropRect.h > 4) btnCrop.disabled = false;
    };
    // 触屏
    cropCanvas.ontouchstart = (e) => { cropCanvas.onmousedown(e.touches[0]); };
    cropCanvas.ontouchmove = (e) => { cropCanvas.onmousemove(e.touches[0]); };
    cropCanvas.ontouchend = cropCanvas.ontouchcancel = cropCanvas.onmouseup;

    btnCrop.onclick = () => {
        if (!cropImg || !cropRect) return;
        const r = cropRect;
        const out = document.createElement('canvas');
        out.width = Math.round(r.w);
        out.height = Math.round(r.h);
        out.getContext('2d').drawImage(cropImg, r.x / cropScale, r.y / cropScale, r.w / cropScale, r.h / cropScale, 0, 0, out.width, out.height);
        downloadDataURL(out.toDataURL('image/png'), `cropped_${Date.now()}.png`);
    };

    // ===== 九宫格 =====
    let grid9Img = null;
    document.getElementById('fileGrid9').onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        grid9Img = await fileToImage(f);
        document.getElementById('infoGrid9').textContent = `原图：${grid9Img.width}×${grid9Img.height}`;
        renderGrid9();
    };
    function renderGrid9() {
        const wrap = document.getElementById('grid9Result');
        wrap.innerHTML = '';
        if (!grid9Img) return;
        const w = Math.floor(grid9Img.width / 3);
        const h = Math.floor(grid9Img.height / 3);
        for (let i = 0; i < 9; i++) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const x = (i % 3) * w;
            const y = Math.floor(i / 3) * h;
            c.getContext('2d').drawImage(grid9Img, x, y, w, h, 0, 0, w, h);
            wrap.appendChild(c);
        }
        document.getElementById('btnGrid9').disabled = false;
    }
    document.getElementById('btnGrid9').onclick = () => {
        const wrap = document.getElementById('grid9Result');
        wrap.querySelectorAll('canvas').forEach((c, i) => {
            setTimeout(() => downloadDataURL(c.toDataURL('image/png'), `grid9_${i+1}.png`), i * 200);
        });
    };
    </script>
</body>
</html>
