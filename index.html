<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="content-type" content="no-cache, must-revalidate" />
    <meta http-equiv="expires" content="Wed, 26 Feb 1997 08:21:57 GMT" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫移达网站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-grad-1: #e0e7ff;
            --bg-grad-2: #fce7f3;
            --text: #1f2937;
            --text-soft: #6b7280;
            --card: #ffffff;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.12);
            --accent: #4a90e2;
            --accent-2: #357ABD;
            --tool-1: #ff6b6b;
            --tool-2: #ff8e53;
        }
        [data-theme="dark"] {
            --bg: #0f1115;
            --bg-grad-1: #1a1d2b;
            --bg-grad-2: #2a1a2b;
            --text: #e5e7eb;
            --text-soft: #9ca3af;
            --card: #1c1f29;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.6);
            --accent: #5ea0f0;
            --accent-2: #4a8ad6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(at 20% 10%, var(--bg-grad-1) 0%, transparent 50%),
                              radial-gradient(at 80% 80%, var(--bg-grad-2) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 顶部行：左 工具按钮(居中) · 右 主题切换 */
        .top-row {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px;
            min-height: calc(100vh - 48px);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .top-row .hero-inner {
            grid-column: 2;
            display: flex;
            justify-content: center;
        }
        .top-row .theme-toggle {
            grid-column: 3;
            justify-self: end;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text);
            transition: transform 0.15s;
        }
        .theme-toggle:hover { transform: scale(1.05); }

        /* Hero（保留兼容，单纯用于空时撑高） */
        .hero {
            text-align: center;
        }
        .tool-btn {
            display: inline-block;
            padding: 18px 48px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--tool-1) 0%, var(--tool-2) 100%);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255,107,107,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }
        .tool-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 32px rgba(255,107,107,0.55);
        }

        /* 底部 */
        @media (max-width: 600px) {
            .tool-btn { padding: 14px 32px; font-size: 17px; }
            .hero { padding: 20px 16px 16px; }
        }
    </style>
</head>
<body>
    <div class="top-row">
        <div class="hero-inner">
            <a class="tool-btn" href="tools/index.html">🛠️ 进入工具页面</a>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
    </div>

    <script>
    // 暗色模式
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggle.textContent = '☀️ 亮色';
    }
    toggle.onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            toggle.textContent = '🌙 暗色';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggle.textContent = '☀️ 亮色';
        }
    };
    </script>
</body>
</html>
