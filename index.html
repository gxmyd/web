<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="content-type" content="no-cache, must-revalidate" />
    <meta http-equiv="expires" content="Wed, 26 Feb 1997 08:21:57 GMT" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫移达网站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-grad-1: #e0e7ff;
            --bg-grad-2: #fce7f3;
            --text: #1f2937;
            --text-soft: #6b7280;
            --card: #ffffff;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.12);
            --accent: #4a90e2;
            --accent-2: #357ABD;
            --tool-1: #ff6b6b;
            --tool-2: #ff8e53;
        }
        [data-theme="dark"] {
            --bg: #0f1115;
            --bg-grad-1: #1a1d2b;
            --bg-grad-2: #2a1a2b;
            --text: #e5e7eb;
            --text-soft: #9ca3af;
            --card: #1c1f29;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 10px 28px rgba(0,0,0,0.6);
            --accent: #5ea0f0;
            --accent-2: #4a8ad6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(at 20% 10%, var(--bg-grad-1) 0%, transparent 50%),
                              radial-gradient(at 80% 80%, var(--bg-grad-2) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 顶部行：左 工具按钮(居中) · 右 主题切换 */
        .top-row {
            max-width: 960px;
            margin: 0 auto;
            padding: 54px 20px 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .top-row .hero-inner {
            grid-column: 2;
            display: flex;
            justify-content: center;
        }
        .top-row .theme-toggle {
            grid-column: 3;
            justify-self: end;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text);
            transition: transform 0.15s;
        }
        .theme-toggle:hover { transform: scale(1.05); }

        /* Hero（保留兼容，单纯用于空时撑高） */
        .hero {
            text-align: center;
        }
        .tool-btn {
            display: inline-block;
            padding: 18px 48px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--tool-1) 0%, var(--tool-2) 100%);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255,107,107,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }
        .tool-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 32px rgba(255,107,107,0.55);
        }

        /* 区块容器 */
        .section {
            max-width: 960px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
            margin: 0 0 16px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, var(--accent), var(--tool-1));
            border-radius: 2px;
        }

        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 16px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .card .icon {
            font-size: 28px;
        }
        .card .name {
            font-size: 15px;
            font-weight: 600;
        }
        .card .desc {
            font-size: 12px;
            color: var(--text-soft);
        }

        /* 底部 */
        @media (max-width: 600px) {
            .tool-btn { padding: 14px 32px; font-size: 17px; }
            .hero { padding: 20px 16px 16px; }
        }
    </style>
</head>
<body>
    <div class="top-row">
        <div class="hero-inner">
            <a class="tool-btn" href="#tools">🛠️ 工具</a>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
    </div>

    <div class="section" id="tools">
        <div class="section-title">工具</div>
        <div class="grid">
            <a class="card" href="tools/image-compressor/index.html">
                <div class="icon">🗜️</div>
                <div class="name">图片压缩</div>
                <div class="desc">压缩图片 · 预估压缩后大小</div>
            </a>
            <a class="card" href="tools/image-converter/index.html">
                <div class="icon">🔄</div>
                <div class="name">格式转换</div>
                <div class="desc">JPG / PNG / WEBP 互转</div>
            </a>
            <a class="card" href="tools/qrcode/index.html">
                <div class="icon">📱</div>
                <div class="name">二维码</div>
                <div class="desc">生成二维码 / 解析二维码</div>
            </a>
            <a class="card" href="tools/ip-calculator/index.html">
                <div class="icon">🌐</div>
                <div class="name">IP 子网</div>
                <div class="desc">IP/掩码 → 网段广播可用范围</div>
            </a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">开发工具</div>
        <div class="grid">
            <a class="card" href="https://gitee.com/gxmyd" target="_blank">
                <div class="icon">🐙</div>
                <div class="name">Gitee 码云</div>
            </a>
            <a class="card" href="https://github.com/gxmyd" target="_blank">
                <div class="icon">🐱</div>
                <div class="name">GitHub</div>
            </a>
            <a class="card" href="https://blog.csdn.net/m0_74608954?type=blog" target="_blank">
                <div class="icon">📝</div>
                <div class="name">CSDN 博客</div>
            </a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">AI 平台</div>
        <div class="grid">
            <a class="card" href="https://platform.xiaomimimo.com/console/api-keys" target="_blank">
                <div class="icon">🌾</div>
                <div class="name">小米 Mimo</div>
            </a>
            <a class="card" href="https://platform.agnes-ai.com/settings/apiKeys" target="_blank">
                <div class="icon">🤖</div>
                <div class="name">Agnes AI</div>
            </a>
            <a class="card" href="https://platform.deepseek.com/usage" target="_blank">
                <div class="icon">🌊</div>
                <div class="name">Deepseek</div>
            </a>
        </div>
    </div>

    <div class="section">
        <div class="section-title">资源</div>
        <div class="grid">
            <a class="card" href="https://easychuan.cn/" target="_blank">
                <div class="icon">📤</div>
                <div class="name">轻松传</div>
                <div class="desc">跨设备传文件 · 64T 无限速</div>
            </a>
            <a class="card" href="https://dash.cloudflare.com/" target="_blank">
                <div class="icon">☁️</div>
                <div class="name">Cloudflare</div>
            </a>
            <a class="card" href="https://www.pcsoft.com.cn/" target="_blank">
                <div class="icon">💾</div>
                <div class="name">PC 下载网</div>
            </a>
        </div>
    </div>

    <script>
    // 暗色模式
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        toggle.textContent = '☀️ 亮色';
    }
    toggle.onclick = () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            toggle.textContent = '🌙 暗色';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggle.textContent = '☀️ 亮色';
        }
    };
    </script>
</body>
</html>
