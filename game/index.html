<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素生存 RPG</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0f1115;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            top: 50%;
            transform: translateY(-50%);
        }
        @media (max-height: 660px) {
            #game-container {
                top: 0;
                transform: none;
            }
        }
        #canvas {
            display: block;
            background: #4a8c3f;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }
        #hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 14px;
            pointer-events: none;
            font-size: 13px;
        }
        .hud-panel {
            background: rgba(15, 17, 21, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .bar {
            width: 220px;
            height: 16px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            margin-bottom: 6px;
            overflow: hidden;
            position: relative;
        }
        .bar > div {
            height: 100%;
            transition: width 0.2s;
        }
        .bar.hp > div {
            background: linear-gradient(90deg, #d32f2f, #ff5252 60%, #ff8a80);
            box-shadow: 0 0 8px rgba(255, 82, 82, 0.6) inset;
        }
        .bar.hunger > div {
            background: linear-gradient(90deg, #f57c00, #ff9800 60%, #ffd54f);
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.5) inset;
        }
        .bar-text {
            position: absolute;
            top: 0; right: 8px;
            line-height: 16px;
            font-size: 11px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        .bar-label {
            position: absolute;
            top: 0; left: 8px;
            line-height: 16px;
            font-size: 11px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        #stats {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        #stats .chip {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 3px 9px;
            border-radius: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }
        #clock {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(15, 17, 21, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        #sfxToggle {
            position: absolute;
            top: 14px;
            right: 250px;
            width: 40px;
            height: 40px;
            background: rgba(15, 17, 21, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        #sfxToggle:hover { background: rgba(15, 17, 21, 0.75); }
        #minimap {
            position: absolute;
            top: 14px;
            right: 130px;
            width: 100px;
            height: 100px;
            background: rgba(15, 17, 21, 0.55);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
        }
        #minimapCanvas {
            display: block;
            width: 100px;
            height: 100px;
        }
        #hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            pointer-events: none;
            background: rgba(15, 17, 21, 0.4);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        #inv {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,17,21,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 18px 22px;
            min-width: 280px;
            pointer-events: auto;
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
        }
        #inv.hidden { display: none; }
        #inv h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #9ca3af;
            font-weight: normal;
        }
        #inv .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #inv .row:last-child { border-bottom: none; }
        #inv .row span:last-child { color: #ffd54f; font-weight: bold; }
        #inv .close {
            margin-top: 10px;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }
        #death {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.78);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
            pointer-events: auto;
        }
        #death.hidden { display: none; }
        #death .sub { font-size: 14px; color: #9ca3af; margin-top: 12px; }
        #death button {
            margin-top: 20px;
            padding: 8px 20px;
            font-size: 14px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        #death button:hover { background: #5ea0f0; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="hud">
            <div class="hud-panel" style="display:inline-block;">
                <div class="bar hp"><div id="hpBar" style="width:100%"></div><span class="bar-label">❤ HP</span><span class="bar-text" id="hpText">100/100</span></div>
                <div class="bar hunger"><div id="hungerBar" style="width:100%"></div><span class="bar-label">🍖 饥饿</span><span class="bar-text" id="hungerText">100/100</span></div>
                <div id="stats">
                    <span class="chip" id="woodChip">🪵 0</span>
                    <span class="chip" id="stoneChip">🪨 0</span>
                    <span class="chip" id="meatChip">🍖 0</span>
                    <span class="chip" id="flowerChip">🌸 0</span>
                </div>
            </div>
        </div>
        <div id="minimap"><canvas id="minimapCanvas" width="100" height="100"></canvas></div>
        <button id="sfxToggle" title="静音/取消静音">🔊</button>
        <div id="clock">⛅ 06:00</div>
        <div id="hint">WASD 移动 · 鼠标点击攻击 · J 砍树 · K 挖石 · E 吃肉 · I 背包 · R 重生</div>
        <div id="inv" class="hidden">
            <h3>背包</h3>
            <div class="row"><span>🪵 木材</span><span id="invWood">0</span></div>
            <div class="row"><span>🪨 石头</span><span id="invStone">0</span></div>
            <div class="row"><span>🍖 生肉</span><span id="invMeat">0</span></div>
            <div class="row"><span>🌸 花朵</span><span id="invFlower">0</span></div>
            <div class="close">按 I 关闭</div>
        </div>
        <div id="death" class="hidden">
            💀 你死了
            <div class="sub">被狼吃了 / 饿死了</div>
            <button onclick="respawn()">重新开始</button>
        </div>
    </div>

    <script>
    // ====== 配置 ======
    const TILE = 32;
    const MAP_W = 80;
    const MAP_H = 80;
    const SCREEN_W = 800;
    const SCREEN_H = 600;
    const DAY_LENGTH = 180; // 秒

    // 瓦片
    const T_GRASS = 0, T_TREE = 1, T_STONE = 2, T_WATER = 3, T_FLOWER = 4, T_BUSH = 5;

    // ====== 工具 ======
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const k = (x, y) => `${x},${y}`;

    // ====== Canvas ======
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const miniCanvas = document.getElementById('minimapCanvas');
    const miniCtx = miniCanvas.getContext('2d');
    miniCtx.imageSmoothingEnabled = false;

    // ====== 世界 ======
    const world = {
        tiles: [],
        resourceHp: {},
        timeOfDay: 0.25, // 0=午夜, 0.25=日出, 0.5=正午, 0.75=日落
        init() {
            this.tiles = [];
            for (let y = 0; y < MAP_H; y++) {
                this.tiles[y] = [];
                for (let x = 0; x < MAP_W; x++) {
                    if (x < 2 || x > MAP_W - 3 || y < 2 || y > MAP_H - 3) {
                        this.tiles[y][x] = T_WATER;
                        continue;
                    }
                    const r = Math.random();
                    let t;
                    if (r < 0.09) t = T_TREE;
                    else if (r < 0.15) t = T_STONE;
                    else if (r < 0.20) t = T_FLOWER;
                    else if (r < 0.24) t = T_BUSH;
                    else if (r < 0.27) t = T_WATER;
                    else t = T_GRASS;
                    this.tiles[y][x] = t;
                }
            }
            // 出生点清空
            const cx = (MAP_W / 2) | 0, cy = (MAP_H / 2) | 0;
            for (let y = cy - 3; y <= cy + 3; y++) {
                for (let x = cx - 3; x <= cx + 3; x++) {
                    this.tiles[y][x] = (Math.random() < 0.3) ? T_FLOWER : T_GRASS;
                }
            }
            // 资源 HP
            this.resourceHp = {};
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    const t = this.tiles[y][x];
                    if (t === T_TREE) this.resourceHp[k(x, y)] = 30;
                    else if (t === T_STONE) this.resourceHp[k(x, y)] = 45;
                }
            }
        },
        isSolid(x, y) {
            // 像素坐标 → 瓦片
            const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
            if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
            const t = this.tiles[ty][tx];
            return t === T_WATER || t === T_TREE || t === T_STONE;
        },
        isSolidTile(tx, ty) {
            if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
            const t = this.tiles[ty][tx];
            return t === T_WATER || t === T_TREE || t === T_STONE;
        },
        damage(tx, ty, dmg) {
            const key = k(tx, ty);
            if (this.resourceHp[key] === undefined) return null;
            this.resourceHp[key] -= dmg;
            if (this.resourceHp[key] <= 0) {
                const t = this.tiles[ty][tx];
                this.tiles[ty][tx] = T_GRASS;
                delete this.resourceHp[key];
                return t;
            }
            return null;
        }
    };

    // ====== 玩家 ======
    const player = {
        x: 0, y: 0,
        vx: 0, vy: 0,
        hp: 100, maxHp: 100,
        hunger: 100, maxHunger: 100,
        speed: 130,
        size: 14, // 碰撞半径
        facing: 0, // 弧度
        attackCd: 0,
        attackAnim: 0,
        hitFlash: 0,
        inventory: { wood: 0, stone: 0, meat: 0, flower: 0 },
        alive: true,
        // 朝向用的世界坐标（用于决定攻击方向）
        targetWorld: { x: 0, y: 0 }
    };

    function respawn() {
        player.hp = 100;
        player.hunger = 100;
        player.alive = true;
        player.x = (MAP_W / 2) * TILE;
        player.y = (MAP_H / 2) * TILE;
        player.inventory = { wood: 0, stone: 0, meat: 0, flower: 0 };
        document.getElementById('death').classList.add('hidden');
    }

    // ====== 生物 ======
    // types: 'wolf', 'deer'
    const entities = [];
    function spawnEntities() {
        entities.length = 0;
        for (let i = 0; i < 14; i++) entities.push(makeEntity('deer'));
        for (let i = 0; i < 6; i++) entities.push(makeEntity('wolf'));
    }
    function makeEntity(type) {
        let x, y;
        // 狼离玩家更远，鹿可以近点
        const minDist = type === 'wolf' ? 700 : 300;
        for (let tries = 0; tries < 80; tries++) {
            x = randInt(5, MAP_W - 5) * TILE + TILE / 2;
            y = randInt(5, MAP_H - 5) * TILE + TILE / 2;
            if (!world.isSolid(x, y) && dist({ x, y }, player) > minDist) break;
        }
        const isWolf = type === 'wolf';
        return {
            type, x, y,
            vx: 0, vy: 0,
            size: isWolf ? 12 : 11,
            hp: isWolf ? 50 : 25,
            maxHp: isWolf ? 50 : 25,
            speed: isWolf ? 75 : 85,
            facing: rand(0, Math.PI * 2),
            attackCd: 0,
            state: 'idle', // idle, wander, chase, flee
            stateT: rand(0, 3),
            wanderDir: rand(0, Math.PI * 2),
            hitFlash: 0
        };
    }

    // ====== 粒子 / 飘字 ======
    const particles = [];
    const floatTexts = [];
    function spawnParticle(x, y, vx, vy, color, life, size) {
        particles.push({ x, y, vx, vy, color, life, lifeMax: life, size: size || 2 });
    }
    function spawnWoodParticles(x, y) {
        for (let i = 0; i < 10; i++) {
            const ang = rand(-Math.PI, 0);
            const sp = rand(60, 140);
            const c = ['#6b4423', '#5a3818', '#8b5a2b', '#3a2a1a'][randInt(0, 3)];
            spawnParticle(x + rand(-6, 6), y + rand(-4, 4), Math.cos(ang) * sp, Math.sin(ang) * sp - 40, c, rand(0.5, 1.0), randInt(2, 4));
        }
    }
    function spawnStoneParticles(x, y) {
        for (let i = 0; i < 8; i++) {
            const ang = rand(-Math.PI, 0);
            const sp = rand(50, 120);
            const c = ['#6b6b7a', '#9a9aaa', '#4a4a5a', '#bdbdbd'][randInt(0, 3)];
            spawnParticle(x + rand(-6, 6), y + rand(-4, 4), Math.cos(ang) * sp, Math.sin(ang) * sp - 30, c, rand(0.4, 0.8), randInt(2, 3));
        }
    }
    function spawnHitParticles(x, y) {
        for (let i = 0; i < 7; i++) {
            const ang = rand(0, Math.PI * 2);
            const sp = rand(70, 150);
            const c = ['#ff5252', '#ffeb3b', '#fff', '#ff9800'][randInt(0, 3)];
            spawnParticle(x + rand(-3, 3), y + rand(-3, 3), Math.cos(ang) * sp, Math.sin(ang) * sp, c, rand(0.2, 0.5), 2);
        }
    }
    function spawnBloodParticles(x, y) {
        for (let i = 0; i < 6; i++) {
            const ang = rand(0, Math.PI * 2);
            const sp = rand(30, 80);
            spawnParticle(x + rand(-2, 2), y + rand(-2, 2), Math.cos(ang) * sp, Math.sin(ang) * sp, '#d32f2f', rand(0.3, 0.6), 2);
        }
    }
    function spawnLeavesParticles(x, y) {
        for (let i = 0; i < 6; i++) {
            const ang = rand(-Math.PI, 0);
            const sp = rand(40, 90);
            const c = ['#2d6e1f', '#4a8c3f', '#1f4a14', '#3d7a2f'][randInt(0, 3)];
            spawnParticle(x + rand(-8, 8), y + rand(-8, 0), Math.cos(ang) * sp, Math.sin(ang) * sp - 20, c, rand(0.6, 1.2), 3);
        }
    }
    function spawnFloatText(x, y, text, color) {
        floatTexts.push({ x, y, text, color: color || '#ffd54f', life: 1.4, lifeMax: 1.4 });
    }
    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 280 * dt;
            p.vx *= 0.98;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            const f = floatTexts[i];
            f.y -= 32 * dt;
            f.life -= dt;
            if (f.life <= 0) floatTexts.splice(i, 1);
        }
    }

    // ====== 音效（Web Audio 实时合成） ======
    let audioCtx = null;
    let muted = false;
    let _noiseBuf = null;
    function ensureAudio() {
        if (audioCtx) return audioCtx;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            audioCtx = new AC();
        } catch (e) { return null; }
        return audioCtx;
    }
    function unlockAudio() {
        const c = ensureAudio();
        if (!c) return;
        if (c.state === 'suspended') c.resume();
    }
    function playTone(f0, f1, dur, type, vol) {
        if (muted || !audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(f0, t);
        if (f1 && f1 !== f0) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
        }
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol || 0.08, t + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
    }
    function playNoise(dur, vol, lowpass) {
        if (muted || !audioCtx) return;
        if (!_noiseBuf) {
            const len = (audioCtx.sampleRate * 0.3) | 0;
            _noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = _noiseBuf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        const src = audioCtx.createBufferSource();
        src.buffer = _noiseBuf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = lowpass || 1500;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        src.connect(filter).connect(gain).connect(audioCtx.destination);
        src.start();
    }
    // 复合音效
    const sfx = {
        chop()  { playTone(220, 100, 0.08, 'square',   0.08); playNoise(0.08, 0.04, 1800); },
        mine()  { playTone(600, 300, 0.10, 'square',   0.08); playTone(900, 500, 0.10, 'triangle', 0.05); },
        hit()   { playTone(180,  80, 0.10, 'sawtooth', 0.10); playNoise(0.08, 0.06, 800); },
        kill()  { playTone(400, 900, 0.22, 'square',   0.10); },
        hurt()  { playTone(220,  80, 0.15, 'sawtooth', 0.13); playNoise(0.10, 0.05, 600); },
        eat()   { playTone(320, 520, 0.08, 'square',   0.08); setTimeout(() => playTone(520, 720, 0.08, 'square', 0.06), 80); },
        step()  { playTone(80,   60, 0.04, 'sine',     0.03); },
        click() { playTone(800, 600, 0.03, 'square',   0.05); },
        death() { playTone(240,  50, 0.60, 'sawtooth', 0.15); },
        pickup(){ playTone(500, 1000, 0.10, 'square',  0.08); }
    };

    // 静音按钮
    const sfxBtn = document.getElementById('sfxToggle');
    function applyMute() {
        sfxBtn.textContent = muted ? '🔇' : '🔊';
        sfxBtn.title = muted ? '取消静音' : '静音';
    }
    sfxBtn.addEventListener('click', () => {
        unlockAudio();
        muted = !muted;
        applyMute();
        if (!muted) sfx.click();
    });
    applyMute();

    // ====== 输入 ======
    const keys = {};
    const mouse = { x: 0, y: 0, worldX: 0, worldY: 0, down: false };
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        unlockAudio();
        if (e.key.toLowerCase() === 'i') { toggleInv(); sfx.click(); }
        if (e.key.toLowerCase() === 'r' && !player.alive) { respawn(); sfx.click(); }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left;
        mouse.y = e.clientY - r.top;
    });
    canvas.addEventListener('mousedown', e => {
        if (e.button === 0) { mouse.down = true; unlockAudio(); }
    });
    canvas.addEventListener('mouseup', e => {
        if (e.button === 0) mouse.down = false;
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    function toggleInv() {
        document.getElementById('inv').classList.toggle('hidden');
    }

    // ====== 摄像机 ======
    const cam = { x: 0, y: 0 };
    function updateCam() {
        cam.x = player.x - SCREEN_W / 2;
        cam.y = player.y - SCREEN_H / 2;
        // 整数化防闪烁
        cam.x = Math.round(cam.x);
        cam.y = Math.round(cam.y);
    }

    // ====== 玩家更新 ======
    let stepTimer = 0;
    function updatePlayer(dt) {
        if (!player.alive) return;

        // 朝向 = 鼠标
        const cx = player.x, cy = player.y;
        mouse.worldX = mouse.x + cam.x;
        mouse.worldY = mouse.y + cam.y;
        player.facing = Math.atan2(mouse.worldY - cy, mouse.worldX - cx);
        player.targetWorld = { x: mouse.worldX, y: mouse.worldY };

        // 移动
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;
        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            dx /= len; dy /= len;
            moveEntity(player, dx * player.speed * dt, dy * player.speed * dt);
            // 走路 step 音效
            stepTimer -= dt;
            if (stepTimer <= 0) {
                sfx.step();
                stepTimer = 0.28;
            }
        } else {
            stepTimer = 0;
        }

        // 攻击
        player.attackCd = Math.max(0, player.attackCd - dt);
        player.attackAnim = Math.max(0, player.attackAnim - dt);
        player.hitFlash = Math.max(0, player.hitFlash - dt);

        if (mouse.down && player.attackCd <= 0) {
            player.attackCd = 0.4;
            player.attackAnim = 0.2;
            // 沿 facing 方向 50 像素内的最近生物/资源
            const reach = 55;
            const tx = cx + Math.cos(player.facing) * reach;
            const ty = cy + Math.sin(player.facing) * reach;
            // 命中生物
            let best = null, bestD = reach * reach;
            for (const e of entities) {
                if (e.hp <= 0) continue;
                const d2 = (e.x - tx) ** 2 + (e.y - ty) ** 2;
                if (d2 < bestD) { bestD = d2; best = e; }
            }
            if (best) {
                best.hp -= 25;
                best.hitFlash = 0.15;
                sfx.hit();
                spawnHitParticles(best.x, best.y);
                if (best.hp <= 0) {
                    sfx.kill();
                    if (best.type === 'deer') {
                        const got = 1 + randInt(0, 1);
                        player.inventory.meat += got;
                        spawnFloatText(best.x, best.y, `+${got}🍖`, '#ff8a80');
                    } else if (best.type === 'wolf') {
                        spawnFloatText(best.x, best.y, `击杀!`, '#ff5252');
                    }
                }
            }
        }

        // J 砍树，K 挖石 — 朝鼠标方向 2 瓦片内找
        if (keys['j'] && player.attackCd <= 0) {
            const target = findResourceTarget(T_TREE, 80);
            if (target) {
                player.attackCd = 0.35;
                player.attackAnim = 0.2;
                sfx.chop();
                const got = world.damage(target.tx, target.ty, 15);
                const tcx = target.tx * TILE + TILE / 2;
                const tcy = target.ty * TILE + TILE / 2;
                spawnWoodParticles(tcx, tcy);
                if (got === T_TREE) {
                    const amt = 1 + randInt(0, 2);
                    player.inventory.wood += amt;
                    sfx.pickup();
                    spawnFloatText(tcx, tcy, `+${amt}🪵`, '#ffd54f');
                }
            }
            keys['j'] = false;
        }
        if (keys['k'] && player.attackCd <= 0) {
            const target = findResourceTarget(T_STONE, 80);
            if (target) {
                player.attackCd = 0.4;
                player.attackAnim = 0.2;
                sfx.mine();
                const got = world.damage(target.tx, target.ty, 12);
                const tcx = target.tx * TILE + TILE / 2;
                const tcy = target.ty * TILE + TILE / 2;
                spawnStoneParticles(tcx, tcy);
                if (got === T_STONE) {
                    const amt = 1 + randInt(0, 1);
                    player.inventory.stone += amt;
                    sfx.pickup();
                    spawnFloatText(tcx, tcy, `+${amt}🪨`, '#bdbdbd');
                }
            }
            keys['k'] = false;
        }

        // 饥饿
        player.hunger = Math.max(0, player.hunger - dt * 0.4);
        if (player.hunger <= 0) {
            player.hp = Math.max(0, player.hp - dt * 3);
        }
        // 吃生肉
        if (keys['e'] && player.inventory.meat > 0 && player.hunger < 100) {
            player.inventory.meat -= 1;
            player.hunger = Math.min(100, player.hunger + 30);
            sfx.eat();
            spawnFloatText(player.x, player.y - 16, '+30🍖', '#ff8a80');
            keys['e'] = false;
        }
        if (player.hp <= 0) {
            if (player.alive) sfx.death();
            player.alive = false;
            document.getElementById('death').classList.remove('hidden');
        }
    }

    function moveEntity(e, dx, dy) {
        // 分别测试 X 和 Y 轴（避免斜角卡墙）
        e.x += dx;
        if (collides(e)) e.x -= dx;
        e.y += dy;
        if (collides(e)) e.y -= dy;
    }
    function collides(e) {
        // 8 点采样 vs 瓦片固体性
        const r = e.size;
        const pts = [
            [e.x - r, e.y - r], [e.x + r, e.y - r],
            [e.x - r, e.y + r], [e.x + r, e.y + r],
            [e.x - r, e.y], [e.x + r, e.y],
            [e.x, e.y - r], [e.x, e.y + r]
        ];
        for (const [px, py] of pts) {
            if (world.isSolid(px, py)) return true;
        }
        return false;
    }

    // 周围 2 瓦片内找最近的指定资源（不限制角度）
    function findResourceTarget(tileType, reach) {
        const cx = player.x, cy = player.y;
        const ptx = (cx / TILE) | 0, pty = (cy / TILE) | 0;
        let best = null, bestD = reach;
        for (let dy = -2; dy <= 2; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
                const tx = ptx + dx, ty = pty + dy;
                if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
                if (world.tiles[ty][tx] !== tileType) continue;
                const txC = tx * TILE + TILE / 2;
                const tyC = ty * TILE + TILE / 2;
                const d = Math.hypot(txC - cx, tyC - cy);
                if (d > reach) continue;
                // 偏向 facing 方向 ±60° 的目标优先（避免身后偷袭砍不到的尴尬）
                const ang = Math.atan2(tyC - cy, txC - cx);
                let diff = Math.abs(ang - player.facing);
                if (diff > Math.PI) diff = 2 * Math.PI - diff;
                const inFront = diff < Math.PI / 2;
                const score = d + (inFront ? 0 : 50);
                if (score < bestD) { bestD = score; best = { tx, ty, d }; }
            }
        }
        return best;
    }

    // ====== 生物更新 ======
    function updateEntities(dt) {
        for (const e of entities) {
            if (e.hp <= 0) continue;
            e.attackCd = Math.max(0, e.attackCd - dt);
            e.hitFlash = Math.max(0, e.hitFlash - dt);
            e.stateT -= dt;
            const d = dist(e, player);
            const seePlayer = d < 280;
            const isWolf = e.type === 'wolf';

            // 状态机
            if (e.hp < e.maxHp * 0.4 && d < 200 && Math.random() < 0.005) {
                e.state = 'flee';
                e.stateT = 2;
            } else if (isWolf && seePlayer) {
                e.state = 'chase';
                e.stateT = 0.5;
            } else if (!isWolf && d < 100) {
                e.state = 'flee';
                e.stateT = 1.5;
            } else if (e.stateT <= 0) {
                e.state = Math.random() < 0.5 ? 'wander' : 'idle';
                e.stateT = rand(1, 3);
                e.wanderDir = rand(0, Math.PI * 2);
            }

            let vx = 0, vy = 0;
            if (e.state === 'chase') {
                const ang = Math.atan2(player.y - e.y, player.x - e.x);
                vx = Math.cos(ang) * e.speed;
                vy = Math.sin(ang) * e.speed;
                e.facing = ang;
            } else if (e.state === 'flee') {
                const ang = Math.atan2(e.y - player.y, e.x - player.x);
                vx = Math.cos(ang) * e.speed;
                vy = Math.sin(ang) * e.speed;
                e.facing = ang;
            } else if (e.state === 'wander') {
                vx = Math.cos(e.wanderDir) * e.speed * 0.4;
                vy = Math.sin(e.wanderDir) * e.speed * 0.4;
            }

            if (vx || vy) moveEntity(e, vx * dt, vy * dt);

            // 狼接触玩家
            if (isWolf && d < e.size + player.size + 2 && e.attackCd <= 0) {
                player.hp = Math.max(0, player.hp - 8);
                player.hitFlash = 0.2;
                sfx.hurt();
                spawnBloodParticles(player.x, player.y);
                spawnFloatText(player.x, player.y - 16, '-8', '#ff5252');
                e.attackCd = 1.0;
                if (player.hp <= 0) {
                    if (player.alive) sfx.death();
                    player.alive = false;
                    document.getElementById('death').classList.remove('hidden');
                }
            }
        }
        // 清理死亡实体
        for (let i = entities.length - 1; i >= 0; i--) {
            if (entities[i].hp <= 0) entities.splice(i, 1);
        }
    }

    // ====== 时间推进 ======
    function updateWorld(dt) {
        world.timeOfDay += dt / DAY_LENGTH;
        if (world.timeOfDay >= 1) world.timeOfDay -= 1;
    }

    // ====== 渲染 ======
    function render() {
        // 昼夜亮度 0.4 ~ 1.0
        const tod = world.timeOfDay;
        // 0=夜, 0.25=晨, 0.5=午, 0.75=暮
        const dayPhase = Math.sin(tod * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5; // 0~1
        const light = 0.4 + dayPhase * 0.6;
        // 草色基调
        const r = Math.round(0x4a * light);
        const g = Math.round(0x8c * light);
        const b = Math.round(0x3f * light);

        // ====== 天空渐变（屏幕固定，不跟摄像机）======
        const SKY_H = 110;
        const sky = ctx.createLinearGradient(0, 0, 0, SKY_H);
        // 午夜: 深紫→黑; 晨: 粉→蓝; 午: 天蓝→浅; 暮: 橙红→紫
        // 简化为 4 关键点插值
        // 0.0 night: #0a0a2a -> #1a1a3a
        // 0.25 dawn: #ff9a8b -> #4a5fa5
        // 0.5 noon: #87ceeb -> #b0e0e6
        // 0.75 dusk: #ff7e5f -> #6b4a8a
        function lerp(a, b, t) { return a + (b - a) * t; }
        function hex(r, g, b) { return `rgb(${r|0},${g|0},${b|0})`; }
        function skyColors(t) {
            // t in [0,1]: 0=夜, 0.25=晨, 0.5=午, 0.75=暮
            const segs = [
                [[10,10,42], [26,26,58]],      // 夜
                [[255,154,139], [74,95,165]],  // 晨
                [[135,206,235], [176,224,230]], // 午
                [[255,126,95], [107,74,138]]   // 暮
            ];
            // 找 t 在哪个段
            const x = t * 4;
            const i = Math.floor(x) % 4;
            const f = x - Math.floor(x);
            const next = (i + 1) % 4;
            return [
                lerp(segs[i][0][0], segs[next][0][0], f),
                lerp(segs[i][0][1], segs[next][0][1], f),
                lerp(segs[i][0][2], segs[next][0][2], f),
                lerp(segs[i][1][0], segs[next][1][0], f),
                lerp(segs[i][1][1], segs[next][1][1], f),
                lerp(segs[i][1][2], segs[next][1][2], f)
            ];
        }
        const [tr, tg, tb, br, bg, bb] = skyColors(tod);
        sky.addColorStop(0, hex(tr, tg, tb));
        sky.addColorStop(1, hex(br, bg, bb));
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, SCREEN_W, SKY_H);

        // 太阳/月亮
        const sunAng = tod * Math.PI * 2 - Math.PI / 2; // -90° = 0
        const sunX = SCREEN_W * 0.5 + Math.cos(sunAng) * 320;
        const sunY = 60 + Math.sin(sunAng) * 40;
        if (dayPhase > 0.3) {
            // 太阳
            const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 30);
            sg.addColorStop(0, 'rgba(255, 240, 180, 1)');
            sg.addColorStop(0.4, 'rgba(255, 200, 120, 0.6)');
            sg.addColorStop(1, 'rgba(255, 180, 100, 0)');
            ctx.fillStyle = sg;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff8d0';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 12, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 月亮
            const mg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 24);
            mg.addColorStop(0, 'rgba(220, 230, 255, 1)');
            mg.addColorStop(0.5, 'rgba(180, 200, 255, 0.5)');
            mg.addColorStop(1, 'rgba(150, 180, 255, 0)');
            ctx.fillStyle = mg;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 24, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e8eeff';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 9, 0, Math.PI * 2);
            ctx.fill();
        }

        // 远山（视差 0.2，跟摄像机但慢）
        const mtnOffset = cam.x * 0.2;
        const mtnY = SKY_H - 20;
        ctx.fillStyle = `rgba(60, 70, 100, ${0.6 + dayPhase * 0.2})`;
        for (let i = -1; i < 7; i++) {
            const peakX = i * 180 - (mtnOffset % 180);
            const peakH = 30 + (i * 37) % 25;
            ctx.beginPath();
            ctx.moveTo(peakX - 90, SKY_H);
            ctx.lineTo(peakX, SKY_H - peakH);
            ctx.lineTo(peakX + 90, SKY_H);
            ctx.closePath();
            ctx.fill();
        }
        // 第二层更远的山（视差 0.1）
        ctx.fillStyle = `rgba(100, 110, 140, ${0.4 + dayPhase * 0.15})`;
        for (let i = -1; i < 9; i++) {
            const peakX = i * 120 - (cam.x * 0.1 % 120);
            const peakH = 18 + (i * 41) % 15;
            ctx.beginPath();
            ctx.moveTo(peakX - 60, SKY_H);
            ctx.lineTo(peakX, SKY_H - peakH);
            ctx.lineTo(peakX + 60, SKY_H);
            ctx.closePath();
            ctx.fill();
        }

        // 云（飘动）
        const cloudOffset = (Date.now() / 60) % (SCREEN_W + 200);
        for (let i = 0; i < 4; i++) {
            const cx = ((i * 250 - cloudOffset + cam.x * 0.15) % (SCREEN_W + 200) + SCREEN_W + 200) % (SCREEN_W + 200) - 100;
            const cy = 20 + i * 12;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.5 * Math.min(1, dayPhase + 0.2)})`;
            // 云由 3-4 个圆组成
            for (let k = 0; k < 4; k++) {
                ctx.beginPath();
                ctx.arc(cx + k * 14, cy + (k % 2) * 3, 8 + (k % 3) * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ====== 草地底（覆盖天空下方）======
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(0, SKY_H, SCREEN_W, SCREEN_H - SKY_H);

        // 视口范围
        const x0 = Math.max(0, Math.floor(cam.x / TILE));
        const y0 = Math.max(0, Math.floor(cam.y / TILE));
        const x1 = Math.min(MAP_W - 1, Math.floor((cam.x + SCREEN_W) / TILE));
        const y1 = Math.min(MAP_H - 1, Math.floor((cam.y + SCREEN_H) / TILE));

        for (let y = y0; y <= y1; y++) {
            for (let x = x0; x <= x1; x++) {
                const t = world.tiles[y][x];
                const sx = Math.round(x * TILE - cam.x);
                const sy = Math.round(y * TILE - cam.y);
                // 跳过被天空覆盖的瓦片（但 y0 是世界坐标，sy < SKY_H 的部分被天空盖）
                if (sy < SKY_H && sy + TILE > SKY_H) {
                    // 部分被天空覆盖：只画被覆盖以下部分
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(sx, SKY_H, TILE, sy + TILE - SKY_H);
                } else if (sy + TILE <= SKY_H) {
                    continue; // 完全在天空下
                } else {
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(sx, sy, TILE, TILE);
                }
                if (t === T_GRASS) {
                    // 草随机色斑
                    if ((x * 31 + y * 17) % 5 === 0) {
                        ctx.fillStyle = `rgb(${Math.round(0x5f*light)},${Math.round(0xa5*light)},${Math.round(0x4a*light)})`;
                        ctx.fillRect(sx + 4, sy + 4, 2, 2);
                    }
                    // 偶尔小花簇
                    if ((x * 53 + y * 89) % 23 === 0) {
                        ctx.fillStyle = '#ffd54f';
                        ctx.fillRect(sx + 8, sy + 8, 2, 2);
                        ctx.fillRect(sx + 20, sy + 18, 2, 2);
                    }
                } else if (t === T_FLOWER) {
                    ctx.fillStyle = '#4a8c3f';
                    ctx.fillRect(sx, sy, TILE, TILE);
                    const colors = ['#ff6b6b', '#ffd54f', '#e1bee7', '#fff', '#ff8a80'];
                    const fc = colors[(x * 7 + y * 13) % 5];
                    ctx.fillStyle = fc;
                    ctx.beginPath();
                    ctx.arc(sx + 16, sy + 16, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff8d0';
                    ctx.fillRect(sx + 15, sy + 15, 2, 2);
                    // 茎
                    ctx.fillStyle = '#2d5e1f';
                    ctx.fillRect(sx + 15, sy + 22, 2, 6);
                } else if (t === T_BUSH) {
                    ctx.fillStyle = '#4a8c3f';
                    ctx.fillRect(sx, sy, TILE, TILE);
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(sx + 16, sy + 28, 12, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3a7c2f';
                    ctx.beginPath();
                    ctx.arc(sx + 16, sy + 18, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#5fa54a';
                    ctx.beginPath();
                    ctx.arc(sx + 13, sy + 14, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sx + 20, sy + 15, 5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (t === T_WATER) {
                    const wobble = Math.sin((Date.now() / 600) + x + y) * 0.3 + 0.7;
                    const wr = Math.round(0x3a * light);
                    const wg = Math.round(0x6f * light * wobble);
                    const wb = Math.round(0xa0 * light);
                    ctx.fillStyle = `rgb(${wr},${wg},${wb})`;
                    ctx.fillRect(sx, sy, TILE, TILE);
                    // 多层波纹
                    ctx.fillStyle = `rgba(255,255,255,${0.35 * light})`;
                    ctx.fillRect(sx + 4 + (Math.sin(x * 1.3 + Date.now()/500) * 3 | 0), sy + 8, 8, 1);
                    ctx.fillRect(sx + 12 + (Math.sin(x * 0.9 + Date.now()/700 + 1) * 3 | 0), sy + 18, 10, 1);
                    ctx.fillRect(sx + 6 + (Math.sin(x * 1.1 + Date.now()/600 + 2) * 2 | 0), sy + 24, 6, 1);
                } else if (t === T_TREE) {
                    // 草地底
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(sx, sy, TILE, TILE);
                    if ((x * 31 + y * 17) % 5 === 0) {
                        ctx.fillStyle = `rgb(${Math.round(0x5f*light)},${Math.round(0xa5*light)},${Math.round(0x4a*light)})`;
                        ctx.fillRect(sx + 4, sy + 4, 2, 2);
                    }
                    // 树阴影
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(sx + 16, sy + 28, 13, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 树干
                    ctx.fillStyle = '#5a3818';
                    ctx.fillRect(sx + 12, sy + 18, 8, 12);
                    ctx.fillStyle = '#6b4423';
                    ctx.fillRect(sx + 13, sy + 18, 3, 12);
                    // 树冠
                    ctx.fillStyle = '#1f4a14';
                    ctx.beginPath();
                    ctx.arc(sx + 16, sy + 11, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2d6e1f';
                    ctx.beginPath();
                    ctx.arc(sx + 16, sy + 9, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#4a8c3f';
                    ctx.beginPath();
                    ctx.arc(sx + 13, sy + 6, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sx + 20, sy + 7, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.beginPath();
                    ctx.arc(sx + 12, sy + 5, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (t === T_STONE) {
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(sx, sy, TILE, TILE);
                    if ((x * 31 + y * 17) % 5 === 0) {
                        ctx.fillStyle = `rgb(${Math.round(0x5f*light)},${Math.round(0xa5*light)},${Math.round(0x4a*light)})`;
                        ctx.fillRect(sx + 4, sy + 4, 2, 2);
                    }
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(sx + 16, sy + 26, 13, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#4a4a5a';
                    ctx.beginPath();
                    ctx.ellipse(sx + 16, sy + 18, 13, 11, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#6b6b7a';
                    ctx.beginPath();
                    ctx.ellipse(sx + 14, sy + 16, 10, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#9a9aaa';
                    ctx.beginPath();
                    ctx.ellipse(sx + 12, sy + 13, 4, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(sx + 12, sy + 12, 2, 1, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ====== 粒子（世界坐标）======
        for (const p of particles) {
            const a = Math.max(0, p.life / p.lifeMax);
            const sx = Math.round(p.x - cam.x);
            const sy = Math.round(p.y - cam.y);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = a;
            ctx.fillRect(sx - p.size / 2, sy - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // ====== 生物 ======
        for (const e of entities) {
            if (e.hp <= 0) continue;
            const sx = Math.round(e.x - cam.x);
            const sy = Math.round(e.y - cam.y);
            if (e.type === 'wolf') drawWolf(sx, sy, e.facing, e.hitFlash > 0, dayPhase);
            else drawDeer(sx, sy, e.facing, e.hitFlash > 0, dayPhase);
        }

        // ====== 玩家 ======
        if (player.alive) {
            const sx = Math.round(player.x - cam.x);
            const sy = Math.round(player.y - cam.y);
            drawPlayer(sx, sy, player.facing, player.attackAnim > 0, player.hitFlash > 0, dayPhase, light);
        }

        // ====== 飘字（世界坐标）======
        for (const f of floatTexts) {
            const a = Math.max(0, f.life / f.lifeMax);
            const sx = Math.round(f.x - cam.x);
            const sy = Math.round(f.y - cam.y);
            ctx.globalAlpha = a;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(f.text, sx + 1, sy + 1);
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, sx, sy);
        }
        ctx.globalAlpha = 1;

        // ====== 夜晚覆盖 ======
        if (light < 0.7) {
            ctx.fillStyle = `rgba(0, 0, 20, ${0.4 * (1 - light)})`;
            ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        }

        // ====== HUD 更新 ======
        document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
        document.getElementById('hungerBar').style.width = (player.hunger / player.maxHunger * 100) + '%';
        document.getElementById('hpText').textContent = Math.round(player.hp) + ' / ' + player.maxHp;
        document.getElementById('hungerText').textContent = Math.round(player.hunger) + ' / ' + player.maxHunger;
        document.getElementById('woodChip').textContent = '🪵 ' + player.inventory.wood;
        document.getElementById('stoneChip').textContent = '🪨 ' + player.inventory.stone;
        document.getElementById('meatChip').textContent = '🍖 ' + player.inventory.meat;
        document.getElementById('flowerChip').textContent = '🌸 ' + player.inventory.flower;
        // 时钟
        const totalMin = (world.timeOfDay * 24 * 60) | 0;
        const hh = (totalMin / 60) | 0;
        const mm = totalMin % 60;
        const pad = n => (n < 10 ? '0' : '') + n;
        const icon = dayPhase > 0.7 ? '☀️' : (dayPhase > 0.3 ? '⛅' : '🌙');
        document.getElementById('clock').textContent = `${icon} ${pad(hh)}:${pad(mm)}`;
        // 背包
        document.getElementById('invWood').textContent = player.inventory.wood;
        document.getElementById('invStone').textContent = player.inventory.stone;
        document.getElementById('invMeat').textContent = player.inventory.meat;
        document.getElementById('invFlower').textContent = player.inventory.flower;

        // ====== 小地图 ======
        renderMinimap(dayPhase, light);
    }

    function renderMinimap(dayPhase, light) {
        const W = 100, H = 100;
        miniCtx.fillStyle = '#1a3a1a';
        miniCtx.fillRect(0, 0, W, H);
        const sx = W / MAP_W, sy = H / MAP_H;
        for (let y = 0; y < MAP_H; y++) {
            for (let x = 0; x < MAP_W; x++) {
                const t = world.tiles[y][x];
                let c = null;
                if (t === T_WATER) c = '#2a4a7a';
                else if (t === T_TREE) c = '#2d5e1f';
                else if (t === T_STONE) c = '#6b6b7a';
                else if (t === T_FLOWER) c = '#5a8a3f';
                else if (t === T_BUSH) c = '#3a7c2f';
                if (c) {
                    miniCtx.fillStyle = c;
                    miniCtx.fillRect(x * sx, y * sy, Math.ceil(sx) + 1, Math.ceil(sy) + 1);
                }
            }
        }
        // 玩家点
        miniCtx.fillStyle = '#4a90e2';
        miniCtx.beginPath();
        miniCtx.arc(player.x / TILE * sx, player.y / TILE * sy, 2, 0, Math.PI * 2);
        miniCtx.fill();
        // 狼（红）
        for (const e of entities) {
            if (e.hp <= 0) continue;
            miniCtx.fillStyle = e.type === 'wolf' ? '#ff5252' : '#a06b3a';
            miniCtx.fillRect(e.x / TILE * sx - 0.5, e.y / TILE * sy - 0.5, 1.5, 1.5);
        }
        // 视口框
        const vx = cam.x / TILE * sx, vy = cam.y / TILE * sy;
        const vw = SCREEN_W / TILE * sx, vh = SCREEN_H / TILE * sy;
        miniCtx.strokeStyle = 'rgba(255,255,255,0.5)';
        miniCtx.lineWidth = 1;
        miniCtx.strokeRect(vx, vy, vw, vh);
    }

    function drawPlayer(sx, sy, facing, attacking, hitFlash, dayPhase, light) {
        // 走路状态判定（玩家是否在移动）
        const moving = (keys['w'] || keys['s'] || keys['a'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright']);
        const walkT = Date.now() / 100;
        const walkPhase = moving ? Math.sin(walkT) : 0;
        const bob = moving ? Math.abs(Math.sin(walkT)) * 2 : Math.sin(walkT / 3) * 0.5;
        const flash = hitFlash ? '#ff8a80' : '#ffdfba';

        // 阴影
        const shadowA = 0.35 - bob * 0.05;
        ctx.fillStyle = `rgba(0,0,0,${shadowA})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy + 15 - bob * 0.5, 10, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 披风（朝 facing 反方向飘）
        const capeAng = facing + Math.PI;
        const capeWave = moving ? Math.sin(walkT * 1.2) * 0.3 : 0;
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(sx - 5, sy - 2 + bob);
        ctx.lineTo(sx + 5, sy - 2 + bob);
        const capeTipX = sx + Math.cos(capeAng + capeWave) * 18;
        const capeTipY = sy + Math.sin(capeAng + capeWave) * 18 + bob;
        ctx.lineTo(capeTipX, capeTipY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#a93226';
        ctx.beginPath();
        ctx.moveTo(sx - 5, sy - 2 + bob);
        ctx.lineTo(sx + 5, sy - 2 + bob);
        const capeTipX2 = sx + Math.cos(capeAng + capeWave) * 16;
        const capeTipY2 = sy + Math.sin(capeAng + capeWave) * 13 + bob;
        ctx.lineTo(capeTipX2, capeTipY2);
        ctx.closePath();
        ctx.fill();

        // 腿（走路摆动）
        const legSwing = walkPhase * (moving ? 3 : 0);
        ctx.fillStyle = '#34495e';
        ctx.fillRect(sx - 5, sy + 9 + bob + legSwing, 4, 5);
        ctx.fillRect(sx + 1, sy + 9 + bob - legSwing, 4, 5);
        // 鞋子
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(sx - 6, sy + 13 + bob + legSwing, 5, 2);
        ctx.fillRect(sx + 0, sy + 13 + bob - legSwing, 5, 2);

        // 身体
        ctx.fillStyle = hitFlash ? '#ff5252' : '#4a90e2';
        ctx.fillRect(sx - 8, sy - 2 + bob, 16, 13);
        // 身体高光
        ctx.fillStyle = hitFlash ? '#ff7a7a' : '#5ea0f0';
        ctx.fillRect(sx - 7, sy - 1 + bob, 2, 11);
        // 腰带
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(sx - 8, sy + 9 + bob, 16, 2);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(sx - 1, sy + 9 + bob, 2, 2);

        // 头
        ctx.fillStyle = flash;
        ctx.fillRect(sx - 7, sy - 14 + bob, 14, 13);
        // 头发
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(sx - 7, sy - 14 + bob, 14, 5);
        // 头发飘动
        if (moving) {
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(sx + 4, sy - 11 + bob + Math.sin(walkT * 0.8) * 1, 3, 4);
        }
        // 眼睛（朝 facing 方向）
        const ex = Math.cos(facing) * 1.5;
        const ey = Math.sin(facing) * 1.5;
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx - 4 + ex, sy - 10 + bob + ey, 2, 2);
        ctx.fillRect(sx + 2 + ex, sy - 10 + bob + ey, 2, 2);
        ctx.fillStyle = '#222';
        ctx.fillRect(sx - 3 + ex, sy - 9 + bob + ey, 1, 1);
        ctx.fillRect(sx + 3 + ex, sy - 9 + bob + ey, 1, 1);

        // 武器挥动（含剑光拖尾）
        if (attacking) {
            const wx = sx + Math.cos(facing) * 12;
            const wy = sy + Math.sin(facing) * 12;
            // 剑光
            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(facing);
            // 拖尾
            const tailGrad = ctx.createLinearGradient(0, 0, 16, 0);
            tailGrad.addColorStop(0, 'rgba(255, 255, 200, 0)');
            tailGrad.addColorStop(0.4, 'rgba(255, 255, 200, 0.6)');
            tailGrad.addColorStop(1, 'rgba(255, 255, 255, 1)');
            ctx.fillStyle = tailGrad;
            ctx.fillRect(-4, -3, 20, 5);
            // 剑身
            ctx.fillStyle = '#dcdcdc';
            ctx.fillRect(-2, -2, 14, 3);
            ctx.fillStyle = '#fff';
            ctx.fillRect(8, -2, 4, 3);
            // 剑柄
            ctx.fillStyle = '#6b4423';
            ctx.fillRect(-5, -2, 4, 3);
            ctx.restore();
        } else {
            // 静止/走路时持剑（手臂摆动）
            const handBob = moving ? Math.sin(walkT) * 1.5 : 0;
            const wx = sx + Math.cos(facing) * 8;
            const wy = sy + Math.sin(facing) * 8 + handBob;
            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(facing);
            ctx.fillStyle = '#bdbdbd';
            ctx.fillRect(-2, -1, 6, 2);
            ctx.fillStyle = '#6b4423';
            ctx.fillRect(-4, -1, 2, 2);
            ctx.restore();
        }
    }

    function drawWolf(sx, sy, facing, hitFlash, dayPhase) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 8, 8, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // 身体
        ctx.fillStyle = hitFlash ? '#ff8a80' : '#5e5e6e';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 2, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // 头
        const hx = sx + Math.cos(facing) * 7;
        const hy = sy + Math.sin(facing) * 7;
        ctx.fillStyle = hitFlash ? '#ff8a80' : '#6e6e7e';
        ctx.beginPath();
        ctx.arc(hx, hy, 5, 0, Math.PI * 2);
        ctx.fill();
        // 眼睛
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(hx - 1, hy - 1, 1, 1);
        ctx.fillRect(hx + 1, hy - 1, 1, 1);
    }

    function drawDeer(sx, sy, facing, hitFlash, dayPhase) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 8, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = hitFlash ? '#ff8a80' : '#a06b3a';
        ctx.beginPath();
        ctx.ellipse(sx, sy + 2, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 头
        const hx = sx + Math.cos(facing) * 6;
        const hy = sy + Math.sin(facing) * 6;
        ctx.fillStyle = hitFlash ? '#ff8a80' : '#b07a4a';
        ctx.beginPath();
        ctx.arc(hx, hy, 4, 0, Math.PI * 2);
        ctx.fill();
        // 鹿角
        ctx.fillStyle = '#5e4423';
        ctx.fillRect(hx - 1, hy - 5, 1, 2);
        ctx.fillRect(hx + 1, hy - 5, 1, 2);
        // 尾白点
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx - Math.cos(facing) * 6, sy - Math.sin(facing) * 6, 2, 2);
    }

    // ====== 存档 ======
    function saveGame() {
        const data = {
            player: {
                x: player.x, y: player.y,
                hp: player.hp, hunger: player.hunger,
                inventory: player.inventory
            },
            tiles: world.tiles,
            resourceHp: world.resourceHp,
            timeOfDay: world.timeOfDay,
            entities: entities
        };
        try { localStorage.setItem('pixsurvival_save', JSON.stringify(data)); } catch (e) {}
    }
    function loadGame() {
        try {
            const s = localStorage.getItem('pixsurvival_save');
            if (!s) return false;
            const data = JSON.parse(s);
            Object.assign(player, data.player);
            player.alive = true;
            world.tiles = data.tiles;
            world.resourceHp = data.resourceHp;
            world.timeOfDay = data.timeOfDay;
            entities.length = 0;
            for (const e of data.entities) entities.push(e);
            return true;
        } catch (e) { return false; }
    }

    // ====== 主循环 ======
    let lastT = 0;
    let saveT = 0;
    function loop(t) {
        const dt = Math.min(0.05, (t - lastT) / 1000);
        lastT = t;
        updatePlayer(dt);
        updateEntities(dt);
        updateWorld(dt);
        updateParticles(dt);
        updateCam();
        render();
        // 自动存档
        saveT += dt;
        if (saveT > 10) { saveT = 0; saveGame(); }
        requestAnimationFrame(loop);
    }

    // ====== 启动 ======
    world.init();
    spawnEntities();
    if (!loadGame()) {
        // 第一次玩：放玩家在中间
        player.x = (MAP_W / 2) * TILE;
        player.y = (MAP_H / 2) * TILE;
    }
    // 鼠标点击时把焦点拉回 canvas（防 I 背包后键盘失效）
    canvas.addEventListener('click', () => canvas.focus());
    requestAnimationFrame(loop);

    </script>
