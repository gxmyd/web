<!---
Description: Home page for game. Calls initialize_game() function in JS_Game.js file on page load and
contains code for game over and game complete modals.
Author: Open Source - Contributor list can be seen in GitHub
-->
<!DOCTYPE html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>僵尸跳跳乐 · The Jumping Dead</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%9F%3C/text%3E%3C/svg%3E">

	<link rel="stylesheet" type="text/css" href="Style-Sheets/JS_game.css">
	<link rel="stylesheet" type="text/css" href="Style-Sheets/InstructionsModal.css">
	<link rel="stylesheet" type="text/css" href="Style-Sheets/GameOverModal.css">
	<link rel="stylesheet" type="text/css" href="Style-Sheets/GameCompleteModal.css">
	<link href="https://fonts.googleapis.com/css?family=Share+Tech+Mono" rel="stylesheet">

	<!--Main game script-->
	<script type="text/javascript" src="Game.js"></script>

</head>

<!--On page load call showInstructions method-->
<body onload="showInstructions()" onkeydown="KeyDown(event)" onkeyup="KeyUp(event)" ondragend="onMouseUp()">
	<!-- Banner -->
	<img id="banner" src="Pictures/banner.png">

	<!--Audio elements-->
	<audio id="bgm" style="display: none" controls>
		<source src="Audio/bgnd_mus.flac" type="audio/flac">
		你的浏览器不支持 audio 元素。
	</audio>

	<audio id="jump" style="display: none" controls>
		<source src="Audio/jump_04.wav" type="audio/wav">
			你的浏览器不支持 audio 元素。
	</audio>

	<audio id="coinpickup" style="display: none" controls>
		<source src="Audio/coin_pickup.wav" type="audio/wav">
			你的浏览器不支持 audio 元素。
	</audio>

	<audio id="gameover" style="display: none" controls>
		<source src="Audio/gameover.wav" type="audio/wav">
			你的浏览器不支持 audio 元素。
	</audio>

	<audio id="gamewon" style="display: none" controls>
		<source src="Audio/win_sound.wav" type="audio/wav">
			你的浏览器不支持 audio 元素。
	</audio>

	<audio id="enemykilled" style="display: none" controls>
		<source src="Audio/enemy_killed.wav" type="audio/wav">
			你的浏览器不支持 audio 元素。
	</audio>



	<!--Restart button on game page-->
	<canvas id="canvas" width=300 height=300></canvas>

	<!--button id="restartButtonNearScore" class="button" onClick="restartGame()">
		<img class="buttonImages" src="Pictures/restart.png" alt="重新开始" />
	</button-->


	<div id="instructionsModal" class="modal">

		<div class="modal-content">

			<h3>游戏说明</h3>

			<p>玩法：</p>
			<ul>
				<li>躲避怪物，完成每关</li>
				<li>跳到怪物头上可以踩死它</li>
				<li>击杀怪物可获得额外分数</li>
			</ul>

			<p>操作：</p>
			<ul>
				<li>屏幕上的按钮</li>
				<li>键盘方向键 或 WASD：左右移动、跳跃、蹲下</li>
				<li>按 P 键 暂停游戏</li>
				<li>按 M 键 开关音乐</li>
                <li>按 空格键 重新开始</li>
			</ul>

			<!--Play button-->
			<div class="startButton">
				<img class="buttonImages" src="Pictures/play.png" width="100%" onClick="initialize_game()" alt="开始" />
			</div>

		</div>
	</div>

	<div id="gameOverModal" class="modal">
		<div class="modal-content">

			<img class="gameOverLabel" src="Pictures/game_over.png" alt="游戏结束">
			<p class="gameOverDesc">点击「重新开始」按钮 或 按 空格键 重玩。</p>

			<div class="restartButton">
				<img class="buttonImages" src="Pictures/restart.png" width="100%" onClick="initialize_game()" alt="重新开始" />
			</div>
		</div>
	</div>

	<div id="gameCompleteModal" class="modal">
		<div class="modal-content">
			<img class="gameOverLabel" src="Pictures/victory.png" alt="胜利">
			<p class="gameOverDesc">恭喜通关！干得漂亮！</p>
			<div class="restartButton">
				<img src="Pictures/restart.png" width="100%" onClick="initialize_game()" alt="重新开始" />
			</div>
		</div>
	</div>

	<div id="gamePauseModal" class="modal">
		<p class="gamePause">游戏已暂停！</p>
		<p class="gamePlayPause">按 P 键 继续</p>
		<div class="resumeButton">
			<img class="button" src="Pictures/resume.png" width="100%" onClick="pauseGame()" alt="继续" />
		</div>
	</div>

	<div id="optionsModal" class="modal">
		<div class="modal-content">
				<div class="gameOptions"><h2>设置</h2></div>
				<div class="mess">
					<label id="mess"></label>
				</div>
				<div class="row">
					<div class="col-25">
        		<label for="Up1">上</label>
					</div>
					<div class="col-75">
        		<input type="text" id="UP" name="up1Key" value="上" onclick="dispMess('UP','UP')" readonly>
					</div>
			</div>
				<div class="row">
					<div class="col-25">
        		<label for="Down1">下</label>
					</div>
					<div class="col-75">
        		<input type="text" id="DOWN" name="down1Key" value="下" onclick="dispMess('DOWN','DOWN')" readonly>
					</div>
			</div>
				<div class="row">
					<div class="col-25">
        		<label for="Left1">左</label>
					</div>
					<div class="col-75">
						<input type="text" id="LEFT" name="left1Key" value="左" onclick="dispMess('LEFT','LEFT')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Right1">右</label>
					</div>
					<div class="col-75">
						<input type="text" id="RIGHT" name="Right1Key" value="右" onclick="dispMess('RIGHT','RIGHT')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Up2">上（备选）</label>
					</div>
					<div class="col-75">
        		<input type="text" id="W" name="wKey" value="W" onclick="dispMess('W','UP')" readonly>
					</div>
			</div>
				<div class="row">
					<div class="col-25">
        		<label for="Down2">下（备选）</label>
					</div>
					<div class="col-75">
        		<input type="text" id="S" name="sKey" value="S" onclick="dispMess('S','DOWN')" readonly>
					</div>
			</div>
				<div class="row">
					<div class="col-25">
        		<label for="Left2">左（备选）</label>
					</div>
					<div class="col-75">
        		<input type="text" id="A" name="left2Key" value="A" onclick="dispMess('A','LEFT')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Right2">右（备选）</label>
					</div>
					<div class="col-75">
						<input type="text" id="D" name="Right2Key" value="D" onclick="dispMess('D','RIGHT')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Restart">重新开始</label>
					</div>
					<div class="col-75">
        		<input type="text" id="SPACE" name="SpaceKey" value="空格" onclick="dispMess('SPACE','SPACE')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Pause">暂停</label>
					</div>
					<div class="col-75">
        		<input type="text" id="P" name="PauseKey" value="P" onclick="dispMess('P','PAUSE')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label for="Sound">音效</label>
					</div>
					<div class="col-75">
        		<input type="text" id="M" name="SoundKey" value="M" onclick="dispMess('M','SND')" readonly>
					</div>
    		</div>
				<div class="row">
					<div class="col-25">
        		<label ><img class="Sound" src="Pictures/audioOn.png" alt="设置" onclick="dispMess('M','SOUND')" id="MImg"></label>
					</div>
					<div class="col-75">
						<button class="button" id="buttonOptions" onClick="gameOptions()">
							<img class="back" src="Pictures/Backbtn.png" alt="设置">
						</button>
					</div>
				</div>
		</div>
	</div>

	<div id="levelTransitionModal" class="modal">
		<div id="levelTransitionModalContent" class="modal-content">
			<img class="gameOverLabel" src="Pictures/victory.png" alt="胜利">
			<p class="levelTransitionMessage">本关通过！</p>
			<p class="levelTransitionMessage">按 C 键 继续</p>
			<div class="resumeButton">
				<img class="button" src="Pictures/resume.png" width="100%" onClick="resumeGame()" alt="继续" />
			</div>
		</div>
	</div>

	<!--Game play buttons-->
	<div id="buttonWrapper">
		<div id="buttonRestart">
			<button id="restartButtonLeft" class="button" onClick="restartGame()">
				<img class="buttonImages" src="Pictures/restart.png" alt="重新开始" />
			</button>
		</div>
		<div id="buttonController">
		<button class="button" onmousedown="moveLeftMouse()" onmouseup="onMouseUp()" ontouchstart="moveLeftMouse()" ontouchend="onMouseUp()">
			<img class="buttonImages" src="Pictures/left.png" alt="左">
		</button>
		<button class="button" onmousedown="moveUp()" ontouchstart="moveUp()">
			<img class="buttonImages" src="Pictures/jump.png" alt="跳">
		</button>
		<button class="button" onmousedown="duck()" onmouseup="duckMouseUp()" ontouchstart="duck()" ontouchend="duckMouseUp()">
			<img class="buttonImages" src="Pictures/duck.png" alt="蹲">
		</button>
		<button class="button" onmousedown="moveRightMouse()" onmouseup="onMouseUp()" ontouchstart="moveRightMouse()" ontouchend="onMouseUp()">
			<img class="buttonImages" src="Pictures/right.png" alt="右">
		</button>
		</div>
		<div id="buttonPauseAudio">
		<button class="button" id="buttonAudio" onClick="muteMusic()" >
			<img class="buttonImages" id="audioButton" src="Pictures/audioOn.png" alt="静音">
		</button>
		<button class="button" id="buttonPause" onClick="pauseGame()">
			<img class="buttonImages" src="Pictures/pause.png" alt="暂停">
		</button>
		<button class="button" id="buttonOptions" onClick="gameOptions()">
			<img class="buttonImages" src="Pictures/Settingsbtn.png" alt="设置">
		</button>
		</div>
	</div>

</body>

</html>
